// Statement Detail — a real page (not a modal), reachable at #statements/<id>,
// with browser Back/Forward support and a breadcrumb back to the Statements list.
function renderStatementDetail(id) {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const s = data.statements.find(x=>x.id===id);
  if (!s) {
    return `<div class="card"><div class="card-body empty-state"><div class="es-ico">❓</div><div class="es-title">Statement not found</div><div class="es-desc">"${H.esc(id)}" doesn't exist (it may have been deleted).</div><div class="es-actions"><button class="btn btn-primary" onclick="nav('statements')">← Back to Statements</button></div></div></div>`;
  }
  const d = data.drivers.find(x=>x.id===s.driverId);
  const mc = data.mcs.find(x=>x.id===s.mcId);

  const loadRows = (s.loads||[]).length ? s.loads.map((l,i)=>`<tr><td class="mono">${H.esc(l.id)}</td><td>${H.esc(l.type||'TL')}</td><td class="num mono">${H.num(l.miles)}</td><td class="num mono">${H.cents(l.gross)}</td><td class="num">${l.rate!=null?l.rate+"%":"—"}</td><td class="num mono pos">${H.cents(l.pay)}</td><td>${AUTH.canEdit()?`<button class="btn btn-sm btn-danger" onclick="rmLoad('${id}',${i})">×</button>`:""}</td></tr>`).join("") : `<tr><td colspan="7" class="muted-2" style="text-align:center;padding:16px">No loads yet</td></tr>`;
  const lineBadge = x => (x.approvalRequired && !x.approved) ? ' <span class="badge badge-critical" style="font-size:9px">UNAPPROVED</span>' : '';
  const lineSrc = x => x.source ? ` <span class="muted-2" title="Source: ${H.esc(x.source)}" style="font-size:11px">📎</span>` : '';
  const dedRows = (s.deductions||[]).length ? s.deductions.map((x,i)=>`<tr><td>${H.esc(x.label)}${lineSrc(x)}${lineBadge(x)}</td><td class="num mono neg">-${H.cents(x.amount)}</td><td>${AUTH.canEdit()?`<button class="btn btn-sm btn-danger" onclick="rmDed('${id}',${i})">×</button>`:""}</td></tr>`).join("") : `<tr><td colspan="3" class="muted-2" style="text-align:center;padding:16px">No deductions</td></tr>`;
  const opRows = (s.otherPay||[]).length ? s.otherPay.map((x,i)=>`<tr><td>${H.esc(x.label)}${lineSrc(x)}${lineBadge(x)}</td><td class="num mono pos">+${H.cents(x.amount)}</td><td>${AUTH.canEdit()?`<button class="btn btn-sm btn-danger" onclick="rmOP('${id}',${i})">×</button>`:""}</td></tr>`).join("") : `<tr><td colspan="3" class="muted-2" style="text-align:center;padding:16px">No other pay</td></tr>`;
  const fuelAmt = (s.deductions||[]).filter(x=>/fuel/i.test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);
  const tollAmt = (s.deductions||[]).filter(x=>/toll/i.test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);

  // Expected pay per current accounting policy — same rule the audit engine uses — so a mismatch is visible here, not just buried in a findings list.
  const policy = POLICY.get(tid);
  let expected = null, expRule = "";
  if (d) {
    if (d.type === "CD") {
      const special = policy.SPECIAL ? policy.SPECIAL[d.name] : null;
      if (special && special.kind === "percent") { expected = Math.round(s.grossTotal*special.rate/100); expRule = `${special.rate}% of gross (special)`; }
      else if (special && (special.kind === "team" || special.kind === "permile")) { expected = s.totalMiles * special.rate; expRule = `$0.${String(special.rate).padStart(2,"0")}/mi (special)`; }
      else if (d.payRate) { expected = s.totalMiles * d.payRate; expRule = `$0.${String(d.payRate).padStart(2,"0")}/mi`; }
      else { expected = s.totalMiles * policy.CD_DEFAULT_RATE; expRule = `Default $0.${String(policy.CD_DEFAULT_RATE).padStart(2,"0")}/mi`; }
    } else {
      const rate = d.type === "OO" ? policy.OO.rate : policy.LEASE.rate;
      expected = Math.round(s.grossTotal * rate / 100); expRule = `${rate}% of gross (${d.type})`;
    }
  }
  const payDiff = expected!=null ? s.earned - expected : null;
  const withinTol = payDiff!=null && Math.abs(payDiff) <= (policy.TOLERANCE_CENTS||0);

  const relatedWOs = data.fleet.filter(w=>w.appliedTo===id);
  const relatedWORows = relatedWOs.length ? relatedWOs.map(w => `<tr class="clickable" onclick="nav('fleet/${w.id}')">
    <td class="mono"><b class="elink">${H.esc(w.id)}</b></td><td>${H.esc(w.date||'—')}</td><td>${H.esc(w.desc||'')}</td>
    <td class="num mono neg">${w.charge?H.cents(w.charge):'—'}</td><td class="num mono pos">${w.refund?H.cents(w.refund):'—'}</td>
    <td><span class="badge badge-${w.status==='APPLIED'?'success':'warning'}">${w.status||'WAITING'}</span></td>
  </tr>`).join("") : "";

  return `
    <div class="page-head">
      <div>
        <p style="margin:0 0 6px"><span class="elink" onclick="nav('statements')">← Back to Statements</span></p>
        <h1 class="page-title">${H.esc(s.id)}</h1>
        <p class="page-sub">${d?`Driver: <span class="elink" onclick="nav('drivers/${d.id}')">${H.esc(d.name)}</span>`:"—"} · ${H.esc(s.period||"—")}</p>
      </div>
      ${AUTH.canEdit()?`<button class="btn btn-danger" onclick="if(confirm('Delete this statement?')){const d2=DATA.get('${tid}');d2.statements=d2.statements.filter(x=>x.id!=='${id}');DATA.save('${tid}',d2);DATA.log('${tid}',AUTH.user().id,'STATEMENT','Statement deleted',{id:'${id}'});nav('statements');toast('Deleted','${H.esc(id)}','success');}">Delete Statement</button>`:""}
    </div>
    <div class="card"><div class="card-body">
      <div class="row" style="margin-bottom:16px">
        <div><div class="muted-2" style="font-size:11px">Driver</div><div><b>${d?`<span class="elink" onclick="nav('drivers/${d.id}')">${H.esc(d.name)}</span>`:"—"}</b></div></div>
        <div><div class="muted-2" style="font-size:11px">Type</div><div><span class="badge badge-${d?.type==='CD'?'info':d?.type==='LEASE'?'primary':'success'}">${d?.type||"?"}</span></div></div>
        <div><div class="muted-2" style="font-size:11px">MC</div><div>${mc?H.esc(mc.name):"—"}</div></div>
        <div><div class="muted-2" style="font-size:11px">Period</div><div>${H.esc(s.period||"—")}</div></div>
      </div>
      <h4 style="margin:16px 0 6px">Loads ${AUTH.canEdit()?`<button class="btn btn-sm btn-primary" onclick="addLoad('${id}')" style="float:right">+ Add Load</button>`:""}</h4>
      <table class="tbl"><thead><tr><th>Load</th><th>Type</th><th class="num">Miles</th><th class="num">Gross</th><th>Rate</th><th class="num">Pay</th><th></th></tr></thead><tbody>${loadRows}</tbody></table>

function recalcStmt(id) {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const s = data.statements.find(x=>x.id===id);
  s.totalMiles = (s.loads||[]).reduce((a,l)=>a+(l.miles||0),0);
  s.grossTotal = (s.loads||[]).reduce((a,l)=>a+(l.gross||0),0);
  s.earned = (s.loads||[]).reduce((a,l)=>a+(l.pay||0),0);
  s.deductTotal = (s.deductions||[]).reduce((a,x)=>a+(x.amount||0),0);
  s.otherTotal = (s.otherPay||[]).reduce((a,x)=>a+(x.amount||0),0);
  s.netPay = s.earned - s.deductTotal + s.otherTotal;
  DATA.save(tid, data);
}

ROUTES.payroll = () => {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const stmts = data.statements;
  if (stmts.length === 0) {
    return `<div class="page-head"><div><h1 class="page-title">Payroll Audit</h1><p class="page-sub">Company Driver per-mile · Lease/OO 86% compliance</p></div></div>
      ${emptyAuditState("No statements to audit", "Add driver statements (manually or via upload) to run payroll audit.")}`;
  }
  const policy = POLICY.get(tid);
  const cdRows = stmts.filter(s=>{const d=data.drivers.find(x=>x.id===s.driverId);return d?.type==="CD";}).map(s=>{
    const d = data.drivers.find(x=>x.id===s.driverId);
    const sp = policy.SPECIAL[d.name];
    let exp = 0, rule = "";
    if (sp?.kind==="percent"){exp=Math.round(s.grossTotal*sp.rate/100);rule=sp.rate+"% of gross";}
    else if (sp?.kind==="team"||sp?.kind==="permile"){exp=s.totalMiles*sp.rate;rule="$0."+String(sp.rate).padStart(2,"0")+"/mi";}
    else if (d.payRate){exp=s.totalMiles*d.payRate;rule="$0."+String(d.payRate).padStart(2,"0")+"/mi";}
    else {exp=s.totalMiles*policy.CD_DEFAULT_RATE;rule="Default $0."+String(policy.CD_DEFAULT_RATE).padStart(2,"0")+"/mi";}
    const diff = s.earned - exp;
    const status = Math.abs(diff) <= policy.TOLERANCE_CENTS ? "PASS" : "ALERT";
    return `<tr><td>${H.avatar(d.name)}</td><td><span class="badge badge-neutral">${rule}</span></td><td class="num mono">${H.num(s.totalMiles)}</td><td class="num mono">${H.cents(exp)}</td><td class="num mono">${H.cents(s.earned)}</td><td class="num mono ${diff===0?'':diff>0?'pos':'neg'}">${diff>=0?'+':''}${H.cents(diff)}</td><td><span class="badge badge-${status==='PASS'?'success':'critical'}">${status}</span></td></tr>`;
  }).join("") || `<tr><td colspan="7" class="muted-2" style="text-align:center;padding:24px">No CD drivers with statements</td></tr>`;

  const pctRows = stmts.filter(s=>{const d=data.drivers.find(x=>x.id===s.driverId);return d?.type==="LEASE"||d?.type==="OO";}).map(s=>{
    const d = data.drivers.find(x=>x.id===s.driverId);
    const rate = policy[d.type].rate;
    const bad = (s.loads||[]).filter(l=>l.rate!==rate);
    const status = bad.length === 0 ? "PASS" : "ALERT";
    return `<tr><td>${H.avatar(d.name)}</td><td><span class="badge badge-${d.type==='LEASE'?'primary':'success'}">${d.type}</span></td><td class="num">${(s.loads||[]).length}</td><td class="num">${(s.loads||[]).length-bad.length}</td><td class="num">${bad.length?`<span class="neg">${bad.length}</span>`:0}</td><td><span class="badge badge-${status==='PASS'?'success':'critical'}">${status}</span></td></tr>`;
  }).join("") || `<tr><td colspan="6" class="muted-2" style="text-align:center;padding:24px">No Lease/OO drivers with statements</td></tr>`;

  return `<div class="page-head"><div><h1 class="page-title">Payroll Audit</h1><p class="page-sub">Policy v${policy.version} · ${stmts.length} statements in review</p></div></div>
    <div class="card" style="margin-bottom:20px"><div class="card-head">Company Drivers — Expected vs Actual</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Driver</th><th>Rule</th><th class="num">Miles</th><th class="num">Expected</th><th class="num">Actual</th><th class="num">Diff</th><th>Status</th></tr></thead><tbody>${cdRows}</tbody></table></div></div>
    <div class="card"><div class="card-head">Lease / OO — ${policy.LEASE.rate}% Compliance</div><div class="table-wrap"><table class="tbl"><thead><tr><th>Driver</th><th>Type</th><th class="num">Loads</th><th class="num">At ${policy.LEASE.rate}%</th><th class="num">Off-rate</th><th>Status</th></tr></thead><tbody>${pctRows}</tbody></table></div></div>`;
};

function editFleetWO(id=null) {

  const existing = id ? data.fleet.find(w=>w.id===id) : null;
  const driverOpts = data.drivers.map(d=>`<option value="${d.id}" ${existing&&existing.driverId===d.id?"selected":""}>${H.esc(d.name)} (#${d.unit||'—'})</option>`).join("");
  const stmtOptsFor = (driverId) => `<option value="">— Not yet applied —</option>` + data.statements.filter(s=>s.driverId===driverId).map(s=>`<option value="${H.esc(s.id)}" ${existing&&existing.appliedTo===s.id?"selected":""}>${H.esc(s.id)} (${H.esc(s.period||'')})</option>`).join("");
  openModal(existing ? `Edit Work Order — ${existing.id}` : "Add Work Order", `
    <div class="field"><label>WO Number *</label><input id="wo-id" value="${existing?H.esc(existing.id):'WO-'+Date.now().toString().slice(-6)}" ${existing?"disabled":""}></div>
    <div class="row">

    </div>
    <div class="field"><label>Description *</label><input id="wo-desc" value="${existing?H.esc(existing.desc||''):''}" placeholder="e.g. Brake pad replacement"></div>
    <div class="row">
      <div class="field"><label>Charge ($)</label><input id="wo-charge" value="${existing&&existing.charge?(existing.charge/100).toFixed(2):''}" placeholder="0.00"></div>

    </div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: existing ? "Save Changes" : "Add", primary: true, onclick: () => {

function importStatementsCSV() {
  openModal("Import Statements from CSV", `
    <p class="muted" style="margin:0 0 14px;font-size:13px">Headers: <code>stmt_id, driver_name, period_start (YYYY-MM-DD), load_id, miles, gross, rate, pay</code><br>One row per load. Statements are built by grouping rows with the same stmt_id.</p>
    <div class="field"><label>Or paste CSV</label><textarea id="csv2" rows="8" placeholder="stmt_id,driver_name,period_start,load_id,miles,gross,rate,pay
ST-001,SMITH JOHN,2026-11-09,LD-1,1000,2500,86,2150"></textarea></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: "Import", primary: true, onclick: () => {
      const text = document.getElementById("csv2").value.trim();
      if (!text) return;
      try {
        const tid = AUTH.session().tenantId;
        const data = DATA.get(tid);
        const lines = text.split(/\r?\n/).filter(l=>l.trim());
        const headers = lines[0].split(",").map(h=>h.trim().toLowerCase());
        const idx = h => headers.indexOf(h);
        const byStmt = {};
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",").map(c=>c.trim().replace(/^"|"$/g,""));
          const sid = cols[idx("stmt_id")];
          const drvName = cols[idx("driver_name")];
          const d = data.drivers.find(x=>x.name.toUpperCase()===drvName.toUpperCase());
          if (!d) continue;
          if (!byStmt[sid]) byStmt[sid] = { id: sid, driverId: d.id, mcId: d.mcId,
            periodStart: new Date(cols[idx("period_start")]).toISOString(),
            period: H.fmtPeriod(cols[idx("period_start")]),
            unit: d.unit||"", loads: [], deductions: [], otherPay: [], status: "IMPORTED" };
          byStmt[sid].loads.push({ id: cols[idx("load_id")],
            miles: parseInt(cols[idx("miles")])||0,
            gross: H.parseMoney(cols[idx("gross")]),
            rate: parseInt(cols[idx("rate")])||null,
            pay: H.parseMoney(cols[idx("pay")]), type: "TL" });
        }
        let added = 0;
        Object.values(byStmt).forEach(s => {
          s.totalMiles = s.loads.reduce((a,l)=>a+l.miles,0);
          s.grossTotal = s.loads.reduce((a,l)=>a+l.gross,0);
          s.earned = s.loads.reduce((a,l)=>a+l.pay,0);
          s.deductTotal = 0; s.otherTotal = 0; s.netPay = s.earned;
          if (!data.statements.find(x=>x.id===s.id)) { data.statements.push(s); added++; }
        });
        data.uploads.push({ name: `CSV paste (${lines.length-1} rows)`, type: "statements", date: new Date().toLocaleString(), records: added, status: "PARSED" });
        DATA.save(tid, data);
        DATA.log(tid, AUTH.user().id, "UPLOAD", `Imported ${added} statements`, {});
        closeModal(); nav("statements");
        toast(`Imported ${added} statements`, "", "success");
      } catch(e) { toast("Import failed", e.message, "error"); }
    }}
  ]);
}

/* ─── Excel / PDF import — file is parsed on the server, rows come back as plain objects; same normalize-and-validate rules as CSV import above ─── */
function pickFile(accept) {
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = accept; inp.style.display = "none";
    inp.onchange = () => { resolve(inp.files[0]||null); inp.remove(); };
    document.body.appendChild(inp); inp.click();
  });
}
function normRow(r) { const o = {}; Object.keys(r).forEach(k => o[String(k||"").trim().toLowerCase()] = r[k]); return o; }

async function importDriversExcel() {
  if (!AUTH.canEdit()) return;
  const file = await pickFile(".xlsx");
  if (!file) return;
  toast("Reading file…", file.name, "info");
  let parsed;
  try { parsed = await FileIO.importFile("xlsx", file); }
  catch (e) { toast("Import failed", e.message, "error"); return; }
  if (!parsed.rows.length) { toast("No rows found", "Check the file has a header row and data below it", "error"); return; }
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  let added = 0, failed = 0;
  parsed.rows.forEach(raw => {
    const row = normRow(raw);
    const mc = data.mcs.find(m => m.code === String(row.mc_code||"").trim());
    if (!mc || !row.name) { failed++; return; }
    data.drivers.push({ id: H.uid("drv"), name: String(row.name).trim(),
      type: String(row.type||"CD").trim().toUpperCase(), mcId: mc.id,
      unit: String(row.unit||"").trim(), pcode: row.pcode ? String(row.pcode).trim() : null,
      payRate: parseInt(row.pay_rate)||null, payTo: String(row.pay_to||"").trim() });
    added++;
  });
  data.uploads.push({ name: file.name, type: "drivers", date: new Date().toLocaleString(), records: added, status: "PARSED" });
  DATA.save(tid, data);
  DATA.log(tid, AUTH.user().id, "DRIVER", `Imported ${added} drivers from Excel`, { added, failed, file: file.name });
  nav("drivers");
  toast(`Imported ${added} drivers`, failed?`${failed} rows skipped (bad MC code or missing name)`:"", "success");
}

function commitStatementRows(rawRows) {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const byStmt = {};
  rawRows.forEach(raw => {
    const row = normRow(raw);
    const sid = String(row.stmt_id||"").trim();
    const drvName = String(row.driver_name||"").trim();
    if (!sid || !drvName) return;
    const d = data.drivers.find(x=>x.name.toUpperCase()===drvName.toUpperCase());
    if (!d) return;
    if (!byStmt[sid]) byStmt[sid] = { id: sid, driverId: d.id, mcId: d.mcId,
      periodStart: new Date(row.period_start).toISOString(), period: H.fmtPeriod(row.period_start),
      unit: d.unit||"", loads: [], deductions: [], otherPay: [], status: "IMPORTED" };
    byStmt[sid].loads.push({ id: String(row.load_id||""), miles: parseInt(row.miles)||0,
      gross: H.parseMoney(row.gross), rate: parseInt(row.rate)||null, pay: H.parseMoney(row.pay), type: "TL" });
  });
  let added = 0;
  Object.values(byStmt).forEach(s => {
    s.totalMiles = s.loads.reduce((a,l)=>a+l.miles,0);
    s.grossTotal = s.loads.reduce((a,l)=>a+l.gross,0);
    s.earned = s.loads.reduce((a,l)=>a+l.pay,0);
    s.deductTotal = 0; s.otherTotal = 0; s.netPay = s.earned;
    if (!data.statements.find(x=>x.id===s.id)) { data.statements.push(s); added++; }
  });
  DATA.save(tid, data);
  return { added, total: rawRows.length };
}

async function importComcheckExcel() {
  if (!AUTH.canEdit()) return;
  const file = await pickFile(".xlsx");
  if (!file) return;
  toast("Reading file…", file.name, "info");
  let parsed;
  try { parsed = await FileIO.importFile("xlsx", file); }
  catch (e) { toast("Import failed", e.message, "error"); return; }
  if (!parsed.rows.length) { toast("No rows found", "Check the file has a header row and data below it", "error"); return; }
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  data.comcheck = data.comcheck || [];
  let matched = 0, unmatched = 0;
  parsed.rows.forEach(raw => {
    const row = normRow(raw);
    const unit = String(row.unit||row.truck||"").trim();
    const drvName = String(row.driver_name||row.driver||row.cardholder||"").trim();
    let d = null;
    if (unit) d = data.drivers.find(x=>String(x.unit||"").trim()===unit);
    if (!d && drvName) d = data.drivers.find(x=>x.name.toUpperCase()===drvName.toUpperCase());
    if (d) matched++; else unmatched++;
    const dateVal = row.date || row.trans_date || row["transaction date"] || "";
    data.comcheck.push({
      id: H.uid("fc"), driverId: d ? d.id : null, unit: unit || (d?d.unit:"") || "",
      date: dateVal ? H.isoDate(new Date(dateVal)) : "",
      amount: H.parseMoney(row.amount||row.total||row["trans amount"]||0),
      type: String(row.type||row.category||"fuel").trim().toLowerCase(),
      location: String(row.location||row.merchant||row.city||"").trim(),
      raw: row
    });
  });
  data.uploads.push({ name: file.name, type: "comcheck", date: new Date().toLocaleString(), records: parsed.rows.length, status: "PARSED" });
  DATA.save(tid, data);
  DATA.log(tid, AUTH.user().id, "COMCHECK", `Imported ${parsed.rows.length} fuel card transactions`, { matched, unmatched, file: file.name });
  nav("comcheck");
  toast(`Imported ${parsed.rows.length} transactions`, `${matched} matched to a driver, ${unmatched} unmatched`, matched?"success":"error");

/* Standardized audit-findings vocabulary (VERIFIED / MISMATCH / DUPLICATE / MISSING SOURCE /
   WRONG DRIVER / WRONG AMOUNT / UNAUTHORIZED-APPROVAL REVIEW / PENDING), layered on top of
   the existing severities/codes without changing them. */
function findingStatus(f) {
  if (f.status) return f.status;
  const byCode = { "MATCH-001":"WRONG DRIVER", "FLEET-MISSING":"MISSING SOURCE", "ESCROW-DUP":"DUPLICATE", "MC-OK":"VERIFIED",
    "PCT-86":"WRONG AMOUNT", "PCT-CALC":"WRONG AMOUNT", "PAY-CD":"WRONG AMOUNT", "PM-CALC":"WRONG AMOUNT", "NET-MATH":"WRONG AMOUNT", "MC-RECON":"MISMATCH" };
  if (byCode[f.code]) return byCode[f.code];
  return f.severity === "OK" ? "VERIFIED" : "PENDING";
}
const FINDING_STATUS_COLOR = { "VERIFIED":"success", "MISMATCH":"critical", "DUPLICATE":"warning", "MISSING SOURCE":"warning",
  "WRONG DRIVER":"critical", "WRONG AMOUNT":"critical", "UNAUTHORIZED / APPROVAL REVIEW":"critical", "PENDING":"info" };

/* ───────────────── ASK JEFF — grounded, deterministic lookup ─────────────────
   This is NOT a generative AI call — there is no LLM behind it, and that is
   deliberate for a financial tool. It only ever does one of two things:
   (1) compute and return a real number/record straight from this tenant's own
       data (DATA.get), or (2) say plainly that nothing matched. It never
       guesses, estimates, or invents a figure that isn't actually in the data. */
const ASK = {
  NOT_FOUND: `<div class="alert alert-warning"><div>❓ <b>Ma'lumot topilmadi / Information not found.</b> So'ralgan narsa ushbu kompaniya bazasida topilmadi, yoki savol juda noaniq. Driver nomi, Statement ID (masalan ST-001) yoki Work Order raqamini (masalan WO-123456) aniqroq kiriting.</div></div>`,
  answer(query, tid) {
    const data = DATA.get(tid);
    const q = (query||"").trim();
    if (!q) return this.NOT_FOUND;
    const ql = q.toLowerCase();

    const stmtHit = data.statements.find(s => s.id && ql.includes(s.id.toLowerCase()));
    if (stmtHit) return this.renderStatementAnswer(stmtHit, data);

    const woHit = data.fleet.find(w => w.id && ql.includes(w.id.toLowerCase()));
    if (woHit) return this.renderWOAnswer(woHit, data);

    const driverHits = data.drivers.filter(d => d.name && (ql.includes(d.name.toLowerCase()) || d.name.toLowerCase().includes(ql)));
    if (driverHits.length === 1) return this.renderDriverAnswer(driverHits[0], ql, data);
    if (driverHits.length > 1) return this.renderMultipleDrivers(driverHits);

    const statusWords = [
      [/unapprov|unauthoriz|approval/i, "UNAUTHORIZED / APPROVAL REVIEW"],
      [/duplicate|takror/i, "DUPLICATE"],
      [/wrong\s*driver/i, "WRONG DRIVER"],
      [/wrong\s*amount/i, "WRONG AMOUNT"],
      [/missing/i, "MISSING SOURCE"],
      [/mismatch/i, "MISMATCH"],
      [/verified|tasdiqlan/i, "VERIFIED"],
      [/pending/i, "PENDING"],
    ];
    for (const [re, status] of statusWords) {
      if (re.test(ql)) return this.renderFindingsByStatus(status, data);
    }

    return this.NOT_FOUND;
  },
  renderStatementAnswer(s, data) {
    const d = data.drivers.find(x=>x.id===s.driverId);
    return `<div class="card"><div class="card-body">
      <h4 style="margin:0 0 10px">Statement <span class="elink" onclick="nav('statements/${s.id}')">${H.esc(s.id)}</span></h4>
      <div class="row">
        <div><div class="muted-2" style="font-size:11px">Driver</div><div>${d?H.avatarLink(d.name,d.id):'<span class="muted-2">—</span>'}</div></div>
        <div><div class="muted-2" style="font-size:11px">Period</div><div>${H.esc(s.period||'—')}</div></div>
        <div><div class="muted-2" style="font-size:11px">Gross</div><div>${H.cents(s.grossTotal)}</div></div>
        <div><div class="muted-2" style="font-size:11px">Earned</div><div>${H.cents(s.earned)}</div></div>
        <div><div class="muted-2" style="font-size:11px">Net Pay</div><div><b>${H.cents(s.netPay)}</b></div></div>
      </div>
    </div></div>`;
  },
  renderWOAnswer(w, data) {
    const d = data.drivers.find(x=>x.id===w.driverId);
    return `<div class="card"><div class="card-body">
      <h4 style="margin:0 0 10px">Work Order <span class="elink" onclick="nav('fleet/${w.id}')">${H.esc(w.id)}</span></h4>
      <div class="row">
        <div><div class="muted-2" style="font-size:11px">Driver</div><div>${d?H.avatarLink(d.name,d.id):'<span class="muted-2">—</span>'}</div></div>
        <div><div class="muted-2" style="font-size:11px">Type</div><div><span class="badge badge-${(w.charge||0)>0?'critical':'success'}">${(w.charge||0)>0?'CHARGE':'REFUND'}</span></div></div>
        <div><div class="muted-2" style="font-size:11px">Amount</div><div><b>${H.cents(w.charge||w.refund||0)}</b></div></div>
        <div><div class="muted-2" style="font-size:11px">Status</div><div><span class="badge badge-${w.status==='APPLIED'?'success':'warning'}">${w.status||'WAITING'}</span></div></div>
      </div>
    </div></div>`;
  },
  renderMultipleDrivers(hits) {
    return `<div class="alert alert-warning"><div>⚠️ Bir nechta driver topildi — aniqroq yozing: ${hits.map(d=>`<span class="elink" onclick="nav('drivers/${d.id}')">${H.esc(d.name)}</span>`).join(", ")}</div></div>`;
  },
  renderDriverAnswer(d, ql, data) {
    const stmts = data.statements.filter(s=>s.driverId===d.id);
    const sum = (arr,key) => arr.reduce((a,x)=>a+(x[key]||0),0);
    const totalMiles = sum(stmts,"totalMiles"), totalGross = sum(stmts,"grossTotal"), totalEarned = sum(stmts,"earned"),
          totalDeduct = sum(stmts,"deductTotal"), totalOther = sum(stmts,"otherTotal"), totalNet = sum(stmts,"netPay");
    const allDed = stmts.flatMap(s=>s.deductions||[]);
    const fuelTotal = allDed.filter(x=>/fuel/i.test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);
    const tollTotal = allDed.filter(x=>/toll/i.test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);
    const facets = [
      { re:/fuel|yoqilg/i, label:"Fuel (lifetime)", val: H.cents(fuelTotal) },
      { re:/toll|yo'?l\s*haqi/i, label:"Toll (lifetime)", val: H.cents(tollTotal) },
      { re:/net|sof/i, label:"Total Net Pay", val: H.cents(totalNet) },
      { re:/gross/i, label:"Total Gross", val: H.cents(totalGross) },
      { re:/mile|milya/i, label:"Total Miles", val: H.num(totalMiles) },
      { re:/earn|topgan/i, label:"Total Earned", val: H.cents(totalEarned) },
      { re:/charge|deduction|xarajat/i, label:"Total Charges", val: H.cents(totalDeduct) },
    ];
    const facetHit = facets.find(f=>f.re.test(ql));
    if (facetHit) {
      return `<div class="alert alert-success"><div>✅ <b>${H.esc(d.name)}</b> — ${facetHit.label}: <b>${facetHit.val}</b> · <span class="elink" onclick="nav('drivers/${d.id}')">to'liq profil</span></div></div>`;
    }
    if (!stmts.length) {
      return `<div class="alert alert-warning"><div>⚠️ <b>${H.esc(d.name)}</b> topildi, lekin hali statement'lari yo'q. <span class="elink" onclick="nav('drivers/${d.id}')">Profilni ko'rish</span></div></div>`;
    }
    return `<div class="card"><div class="card-body">
      <h4 style="margin:0 0 10px">${H.avatarLink(d.name,d.id)} <span class="badge badge-neutral">${d.type}</span></h4>
      <div class="row">
        <div><div class="muted-2" style="font-size:11px">Statements</div><div><b>${stmts.length}</b></div></div>
        <div><div class="muted-2" style="font-size:11px">Total Miles</div><div><b>${H.num(totalMiles)}</b></div></div>
        <div><div class="muted-2" style="font-size:11px">Total Gross</div><div><b>${H.cents(totalGross)}</b></div></div>
        <div><div class="muted-2" style="font-size:11px">Total Net Pay</div><div><b>${H.cents(totalNet)}</b></div></div>
      </div>
      <div style="margin-top:10px"><span class="elink" onclick="nav('drivers/${d.id}')">→ To'liq driver profilini ochish</span></div>
    </div></div>`;
  },
  renderFindingsByStatus(status, data) {
    const lastRun = data.auditRuns[data.auditRuns.length-1];
    if (!lastRun) return `<div class="alert alert-warning"><div>❓ <b>Ma'lumot topilmadi.</b> Hali hech qanday audit ishga tushirilmagan. Avval "▶ RUN FULL AUDIT" tugmasini bosing.</div></div>`;
    const matches = (lastRun.flags||[]).filter(f => findingStatus(f) === status);
    if (!matches.length) return `<div class="alert alert-success"><div>✅ "${H.esc(status)}" statusidagi topilma yo'q (oxirgi audit: ${new Date(lastRun.at).toLocaleString()}).</div></div>`;
    const rows = matches.map(f => { const d = data.drivers.find(x=>x.id===f.driverId); return `<div class="flag sev-${f.severity.toLowerCase()}"><div class="flag-sev">${f.severity}</div><div class="flag-body"><div class="flag-title">${H.esc(f.title)}</div><div class="flag-desc">${H.esc(f.desc)}</div><div class="flag-meta"><span>👤 ${d?H.avatarLink(d.name,d.id):(f.driverId||'—')}</span><span>🏷️ ${f.code}</span></div></div></div>`; }).join("");
    return `<div class="card"><div class="card-head">"${H.esc(status)}" — ${matches.length} ta topilma</div><div class="card-body">${rows}</div></div>`;
  }
};

function renderAuditResult(run, data) {
  const sev = run.summary.by; const risk = run.summary.risk;
  const riskColor = risk>60?"var(--critical)":risk>30?"var(--warning)":"var(--success)";
  const flagList = (run.flags||[]).sort((a,b)=>{const o={CRITICAL:0,HIGH:1,MEDIUM:2,LOW:3,OK:4};return o[a.severity]-o[b.severity];}).map(f=>{
    const d = data.drivers.find(x=>x.id===f.driverId);
    const st = findingStatus(f);
    const srcTxt = f.source||f.stmtId||'—';
    const srcStmt = data.statements.find(x=>x.id===(f.stmtId||f.source));
    const NEXT_ACTION = { "VERIFIED":"No action needed", "MISMATCH":"Compare source records and correct the statement",
      "DUPLICATE":"Confirm which charge is valid and reverse the duplicate", "MISSING SOURCE":"Locate or attach the supporting record",
      "WRONG DRIVER":"Re-assign to the correct driver", "WRONG AMOUNT":"Recalculate and correct the amount",
      "UNAUTHORIZED / APPROVAL REVIEW":"Obtain approval or reverse the charge", "PENDING":"Review and resolve" };
    const evidenceLine = (f.expected!=null || f.actual!=null) ? `<div class="flag-meta" style="margin-top:4px">
      ${f.expected!=null?`<span>Expected: <b>${H.cents(f.expected)}</b></span>`:""}
      ${f.actual!=null?`<span>Actual: <b>${H.cents(f.actual)}</b></span>`:""}
      ${f.diff!=null?`<span>Diff: <b>${f.diff>=0?'+':''}${H.cents(f.diff)}</b></span>`:""}
    </div>` : "";
    return `<div class="flag sev-${f.severity.toLowerCase()}"><div class="flag-sev">${f.severity}</div><div class="flag-body"><div class="flag-title">${H.esc(f.title)} <span class="badge badge-${FINDING_STATUS_COLOR[st]||'neutral'}" style="font-size:10px;vertical-align:middle">${st}</span></div><div class="flag-desc">${H.esc(f.desc)}</div>${evidenceLine}<div class="flag-meta"><span>👤 ${d?H.avatarLink(d.name,d.id):(f.driverId||'—')}</span><span>📄 ${srcStmt?`<span class="elink" onclick="nav('statements/${srcStmt.id}')">${H.esc(srcTxt)}</span>`:H.esc(srcTxt)}</span><span>🏷️ ${f.code}</span></div><div class="muted-2" style="font-size:11px;margin-top:4px">➡️ ${NEXT_ACTION[st]||"Review and resolve"}</div></div></div>`;
  }).join("") || `<div class="muted" style="padding:14px;text-align:center">No findings</div>`;
  return `<div class="grid-2" style="margin-bottom:20px">
    <div class="card"><div class="card-head">Risk Score</div><div class="card-body" style="text-align:center"><div style="font-size:52px;font-weight:800;color:${riskColor}">${risk}<span style="font-size:20px;color:var(--text-3)">/100</span></div><div class="muted">${risk>60?"High":risk>30?"Moderate":"Low"} risk</div><div class="muted-2" style="font-size:11px;margin-top:8px">Audit run at ${new Date(run.at).toLocaleString()}</div><div class="muted-2" style="font-size:11px">Policy v${run.policyVersion} · ${run.stmtCount} stmts reviewed</div></div></div>
    <div class="card"><div class="card-head">Findings Summary</div><div class="card-body"><div style="display:flex;gap:12px;flex-wrap:wrap">
      ${['CRITICAL','HIGH','MEDIUM','LOW','OK'].map(k=>`<div style="flex:1;min-width:80px;text-align:center;padding:10px;background:var(--${k==='OK'?'success':k==='LOW'?'info':k==='MEDIUM'?'warning':'critical'}-soft);border-radius:8px"><div style="font-size:22px;font-weight:800;color:var(--${k==='OK'?'success':k==='LOW'?'info':k==='MEDIUM'?'warning':'critical'})">${sev[k]||0}</div><div class="muted" style="font-size:11px;text-transform:uppercase">${k}</div></div>`).join("")}
    </div></div></div>
  </div>
  <div class="card"><div class="card-head">Findings (${run.flags.length})</div><div class="card-body">${flagList}</div></div>`;
}

function editPolicy() {
  if (!AUTH.isAdmin()) return;
  const tid = AUTH.session().tenantId;
  const policy = POLICY.get(tid);
  openModal("Edit Accounting Policy", `
    <div class="alert alert-warning" style="margin-bottom:16px"><div>⚠️ This creates a new policy version. All future audits use it. Past audits keep their version.</div></div>
    <h4 style="margin:0 0 10px">Lease/OO Load Rate</h4>
    <div class="row">
      <div class="field"><label>OO rate (%)</label><input type="number" id="pol-oo-rate" value="${policy.OO.rate}"></div>
      <div class="field"><label>Lease rate (%)</label><input type="number" id="pol-lease-rate" value="${policy.LEASE.rate}"></div>
    </div>
    <h4 style="margin:10px 0 10px">OO Weekly Fixed ($)</h4>
    <div class="row">
      <div class="field"><label>Admin</label><input id="pol-oo-admin" value="${(policy.OO.admin/100).toFixed(2)}"></div>
      <div class="field"><label>IFTA</label><input id="pol-oo-ifta" value="${(policy.OO.ifta/100).toFixed(2)}"></div>
      <div class="field"><label>Cargo Ins</label><input id="pol-oo-cargo" value="${(policy.OO.cargoInsurance/100).toFixed(2)}"></div>
      <div class="field"><label>Pre-pass</label><input id="pol-oo-prepass" value="${(policy.OO.prepass/100).toFixed(2)}"></div>
      <div class="field"><label>Trailer</label><input id="pol-oo-trailer" value="${(policy.OO.trailer/100).toFixed(2)}"></div>
    </div>
    <h4 style="margin:10px 0 10px">Lease Weekly Fixed ($)</h4>
    <div class="row">
      <div class="field"><label>Insurance</label><input id="pol-ls-insurance" value="${(policy.LEASE.insurance/100).toFixed(2)}"></div>
      <div class="field"><label>Admin</label><input id="pol-ls-admin" value="${(policy.LEASE.admin/100).toFixed(2)}"></div>
      <div class="field"><label>IFTA</label><input id="pol-ls-ifta" value="${(policy.LEASE.ifta/100).toFixed(2)}"></div>
      <div class="field"><label>Pre-pass</label><input id="pol-ls-prepass" value="${(policy.LEASE.prepass/100).toFixed(2)}"></div>
      <div class="field"><label>Trailer</label><input id="pol-ls-trailer" value="${(policy.LEASE.trailer/100).toFixed(2)}"></div>
    </div>
    <h4 style="margin:10px 0 10px">P-Codes (Lease per-mile rate &amp; weekly lease)</h4>
    ${Object.entries(policy.PCODES).map(([k,v])=>`
    <div class="row" style="align-items:flex-end">
      <div class="field" style="flex:0 0 70px"><label>${k}</label><input disabled value="${H.esc(v.label)}"></div>
      <div class="field"><label>Per-Mile (¢)</label><input type="number" id="pol-pc-${k}-pm" value="${v.perMile}"></div>
      <div class="field"><label>Weekly Lease ($)</label><input id="pol-pc-${k}-wl" value="${(v.lease/100).toFixed(2)}"></div>
    </div>`).join("")}
    <h4 style="margin:10px 0 10px">Add a New P-Code (optional)</h4>
    <div class="row">
      <div class="field" style="flex:0 0 70px"><label>Code</label><input id="pol-new-code" placeholder="e.g. A7"></div>
      <div class="field"><label>Label</label><input id="pol-new-label" placeholder="e.g. A7 New Rig"></div>
      <div class="field"><label>Per-Mile (¢)</label><input type="number" id="pol-new-pm" placeholder="11"></div>
      <div class="field"><label>Weekly Lease ($)</label><input id="pol-new-wl" placeholder="900.00"></div>
    </div>
    <h4 style="margin:10px 0 10px">Tolerance</h4>
    <div class="field"><label>Cents tolerance (0 = strict)</label><input type="number" id="pol-tol" value="${policy.TOLERANCE_CENTS}"></div>
    <h4 style="margin:10px 0 10px">Change Reason *</h4>
    <div class="field"><textarea id="pol-reason" rows="2" placeholder="Why are you changing this policy?"></textarea></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: "Save New Version", primary: true, onclick: () => {
      const reason = document.getElementById("pol-reason").value.trim();

      const next = JSON.parse(JSON.stringify(policy));
      next.OO.rate = parseInt(document.getElementById("pol-oo-rate").value);
      next.LEASE.rate = parseInt(document.getElementById("pol-lease-rate").value);
      next.OO.admin = H.parseMoney(document.getElementById("pol-oo-admin").value);
      next.OO.ifta = H.parseMoney(document.getElementById("pol-oo-ifta").value);
      next.OO.cargoInsurance = H.parseMoney(document.getElementById("pol-oo-cargo").value);
      next.OO.prepass = H.parseMoney(document.getElementById("pol-oo-prepass").value);
      next.OO.trailer = H.parseMoney(document.getElementById("pol-oo-trailer").value);
      next.OO.total = next.OO.admin + next.OO.ifta + next.OO.cargoInsurance + next.OO.prepass + next.OO.trailer;
      next.LEASE.insurance = H.parseMoney(document.getElementById("pol-ls-insurance").value);
      next.LEASE.admin = H.parseMoney(document.getElementById("pol-ls-admin").value);
      next.LEASE.ifta = H.parseMoney(document.getElementById("pol-ls-ifta").value);
      next.LEASE.prepass = H.parseMoney(document.getElementById("pol-ls-prepass").value);
      next.LEASE.trailer = H.parseMoney(document.getElementById("pol-ls-trailer").value);
      Object.keys(policy.PCODES).forEach(k => {
        const pmEl = document.getElementById(`pol-pc-${k}-pm`);
        const wlEl = document.getElementById(`pol-pc-${k}-wl`);
        if (pmEl) next.PCODES[k].perMile = parseInt(pmEl.value) || 0;
        if (wlEl) next.PCODES[k].lease = H.parseMoney(wlEl.value);
      });
      const newCode = document.getElementById("pol-new-code").value.trim().toUpperCase();
      if (newCode) {
        if (next.PCODES[newCode]) { toast("P-Code already exists", newCode, "error"); return; }
        next.PCODES[newCode] = {
          perMile: parseInt(document.getElementById("pol-new-pm").value) || 0,
          lease: H.parseMoney(document.getElementById("pol-new-wl").value),
          label: document.getElementById("pol-new-label").value.trim() || newCode
        };
      }
      next.TOLERANCE_CENTS = parseInt(document.getElementById("pol-tol").value)||1;
      POLICY.save(tid, next, AUTH.user().id, reason);
      closeModal(); nav("policy"); toast("Policy saved", `New version v${next.version}`, "success");
    }}
  ]);
}

function editSpecialArrangement(driverName) {
  if (!AUTH.isAdmin()) return;
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const policy = POLICY.get(tid);
  const isEdit = !!driverName;
  const existing = isEdit ? policy.SPECIAL[driverName] : null;
  const driverOptions = (data.drivers||[])
    .filter(d => isEdit ? d.name === driverName : !policy.SPECIAL[d.name])
    .map(d => `<option value="${H.esc(d.name)}" ${isEdit && d.name===driverName ? "selected" : ""}>${H.esc(d.name)}${d.type?` (${d.type})`:""}</option>`).join("");
  if (!isEdit && !driverOptions) { toast("No eligible drivers", "All drivers already have a special arrangement, or no drivers exist yet.", "error"); return; }
  openModal(isEdit ? "Edit Special Pay Arrangement" : "Add New Policy — Special Pay Arrangement", `
    <div class="alert alert-warning" style="margin-bottom:16px"><div>⚠️ This creates a new policy version and overrides the default per-mile rate for the selected driver on future audits.</div></div>
    <div class="field"><label>Driver *</label><select id="spc-driver" ${isEdit?"disabled":""}>${driverOptions}</select></div>
    <div class="field"><label>Arrangement Type *</label><select id="spc-kind" onchange="document.getElementById('spc-rate-label').textContent = this.value==='percent' ? 'Rate (% of gross)' : 'Rate (¢ per mile)'">
      <option value="percent" ${existing&&existing.kind==="percent"?"selected":""}>Percent of Gross</option>
      <option value="team" ${existing&&existing.kind==="team"?"selected":""}>Team Rate ($/mi)</option>
      <option value="permile" ${!existing||existing.kind==="permile"?"selected":""}>Custom Per-Mile ($/mi)</option>
    </select></div>
    <div class="field"><label id="spc-rate-label">${existing&&existing.kind==="percent"?"Rate (% of gross)":"Rate (¢ per mile)"}</label><input type="number" id="spc-rate" value="${existing?existing.rate:""}" placeholder="${existing&&existing.kind==='percent'?'e.g. 75':'e.g. 70 = $0.70/mi'}"></div>
    <h4 style="margin:14px 0 10px">Change Reason *</h4>
    <div class="field"><textarea id="spc-reason" rows="2" placeholder="Why is this driver getting a special arrangement?"></textarea></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: isEdit ? "Save Changes" : "Add Arrangement", primary: true, onclick: () => {
      const driver = document.getElementById("spc-driver").value;
      const kind = document.getElementById("spc-kind").value;
      const rate = parseInt(document.getElementById("spc-rate").value);
      const reason = document.getElementById("spc-reason").value.trim();
      if (!driver) { toast("Select a driver", "", "error"); return; }
      if (isNaN(rate) || rate <= 0) { toast("Enter a valid rate", "", "error"); return; }
      if (!reason) { toast("Reason required", "", "error"); return; }
      const next = JSON.parse(JSON.stringify(policy));
      if (!next.SPECIAL) next.SPECIAL = {};
      next.SPECIAL[driver] = { kind, rate };
      POLICY.save(tid, next, AUTH.user().id, reason);
      closeModal(); nav("policy"); toast(isEdit ? "Arrangement updated" : "Arrangement added", `${driver} · v${next.version}`, "success");
    }}
  ]);
}

function removeSpecialArrangement(driverName) {
  if (!AUTH.isAdmin()) return;
  if (!confirm(`Remove the special pay arrangement for ${driverName}? They will revert to the default per-mile rate.`)) return;
  const reason = prompt("Reason for removing this arrangement:", "No longer applicable");
  if (reason === null) return;
  const tid = AUTH.session().tenantId;
  const policy = POLICY.get(tid);
  const next = JSON.parse(JSON.stringify(policy));
  delete next.SPECIAL[driverName];
  POLICY.save(tid, next, AUTH.user().id, reason.trim() || "Removed special arrangement");
  nav("policy"); toast("Arrangement removed", driverName, "success");
}

async function loadTeamCache() {

  try {
    const team = await apiRequest("/api/auth/team");

async function initApp() {
  if (!AUTH.requireAuth()) return;
  document.getElementById("app").innerHTML = `<div class="auth-shell" style="grid-column:1/-1"><div class="muted">Loading your workspace…</div></div>`;
  document.getElementById("app").className = "auth-view";

  // Refresh /me from the server (role/status may have changed since last login).
  try {
    const me = await apiRequest("/api/auth/me");
    AUTH.setMe(me.user, me.tenant);
  } catch (e) {
    // Expired/invalid token — back to sign in.
    AUTH.logout();
    return;
  }

  const user = AUTH.user();
  // Pending approval check — show waiting screen
  if (user && user.status === "PENDING") {
    document.getElementById("app").innerHTML = `
      <div class="auth-shell" style="grid-column:1/-1">
        <div class="auth-card">
          <div class="auth-brand"><div class="brand-logo">⏳</div><div class="auth-title">Awaiting Approval</div></div>
          <p class="muted" style="text-align:center;font-size:13.5px;margin:0 0 20px">Hi <b>${H.esc(user.fullName)}</b>, your account for <b>${H.esc(AUTH.tenant().name)}</b> is pending approval by the platform owner.</p>
          <div class="alert alert-info" style="margin-bottom:16px"><div>📧 You'll receive an email at <b>${H.esc(user.email)}</b> once your account is approved. This typically takes 1–2 business days.</div></div>
          <div class="alert alert-warning" style="margin-bottom:16px"><div>🔒 <b>2-step verification:</b> This ensures only authorized users access the accounting data. Contact the platform owner if you need faster approval.</div></div>
          <button class="btn btn-block" onclick="AUTH.logout()">← Back to Sign In</button>
        </div>
      </div>`;
    document.getElementById("app").className = "auth-view";
    return;
  }
  if (user && user.status === "REJECTED") {
    document.getElementById("app").innerHTML = `
      <div class="auth-shell" style="grid-column:1/-1">
        <div class="auth-card">
          <div class="auth-brand"><div class="brand-logo" style="background:linear-gradient(135deg,#F87171,#EF4444)">✕</div><div class="auth-title">Access Denied</div></div>
          <div class="alert alert-danger" style="margin:16px 0"><div>Your registration was rejected by the platform owner.</div></div>
          <button class="btn btn-block" onclick="AUTH.logout()">← Back to Sign In</button>
        </div>
      </div>`;
    document.getElementById("app").className = "auth-view";
    return;
  }
  await DATA.load();
  await loadTeamCache();
  if (AUTH.isSuperAdmin()) {
    try { _pendingCount = (await apiRequest("/api/auth/pending")).length; } catch (e) { /* non-fatal */ }
  }

  const route = (location.hash||"#overview").slice(1);
  const routeBase = route.split("/")[0];
  currentRoute = ROUTES[routeBase] ? route : "overview";
  renderShell();
  window.addEventListener("hashchange", () => nav((location.hash||"#overview").slice(1)));
  // Browser Back/Forward: nav() updates history via pushState (not location.hash=),
  // so Back/Forward fires "popstate", not "hashchange" — listen for both.
  window.addEventListener("popstate", () => nav((location.hash||"#overview").slice(1)));
  document.getElementById("modal-ov").onclick = (e) => { if (e.target.id === "modal-ov") closeModal(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
else initApp();

</script>
</body>
</html>
