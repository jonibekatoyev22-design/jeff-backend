<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeff Accountant — AI Trucking Auditor</title>
<meta name="description" content="Multi-tenant AI-powered trucking accounting audit SaaS platform">
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>/* ═══════════════════════════════════════════════════════════════
   JEFF ACCOUNTANT v3 — DESIGN SYSTEM
   Light + Dark themes via CSS variables
   ═══════════════════════════════════════════════════════════════ */

:root, [data-theme="light"] {
  --bg:           #F5F7FB;
  --bg-elev-1:   #FFFFFF;
  --bg-elev-2:   #F8FAFC;
  --bg-elev-3:   #F1F5F9;
  --border:       rgba(15,23,42,.08);
  --border-strong:rgba(15,23,42,.14);
  --text:         #0F172A;
  --text-2:       #475569;
  --text-3:       #94A3B8;
  --primary:      #3B82F6;
  --primary-2:   #8B5CF6;
  --primary-soft: rgba(59,130,246,.10);
  --success:      #10B981;
  --success-soft: rgba(16,185,129,.12);
  --warning:      #F59E0B;
  --warning-soft: rgba(245,158,11,.12);
  --critical:     #EF4444;
  --critical-soft:rgba(239,68,68,.10);
  --info:         #0EA5E9;
  --info-soft:    rgba(14,165,233,.12);
  --shadow-sm:    0 1px 2px rgba(15,23,42,.04);
  --shadow-md:    0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:    0 12px 32px rgba(15,23,42,.10);
  --scheme: light;
}

[data-theme="dark"] {
  --bg:           #070B14;
  --bg-elev-1:   #0D1322;
  --bg-elev-2:   #141B2D;
  --bg-elev-3:   #1A2336;
  --border:       rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --text:         #F1F5F9;
  --text-2:       #94A3B8;
  --text-3:       #64748B;
  --primary:      #3B82F6;
  --primary-2:   #8B5CF6;
  --primary-soft: rgba(59,130,246,.12);
  --success:      #34D399;
  --success-soft: rgba(52,211,153,.10);
  --warning:      #FBBF24;
  --warning-soft: rgba(251,191,36,.10);
  --critical:     #F87171;
  --critical-soft:rgba(248,113,113,.10);
  --info:         #60A5FA;
  --info-soft:    rgba(96,165,250,.10);
  --shadow-sm:    0 1px 2px rgba(0,0,0,.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,.3);
  --shadow-lg:    0 12px 32px rgba(0,0,0,.4);
  --scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #070B14;
    --bg-elev-1:   #0D1322;
    --bg-elev-2:   #141B2D;
    --bg-elev-3:   #1A2336;
    --border:       rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.14);
    --text:         #F1F5F9;
    --text-2:       #94A3B8;
    --text-3:       #64748B;
    --success:      #34D399;
    --warning:      #FBBF24;
    --critical:     #F87171;
    --info:         #60A5FA;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.2);
    --shadow-md:    0 4px 12px rgba(0,0,0,.3);
    --shadow-lg:    0 12px 32px rgba(0,0,0,.4);
    --scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  color-scheme: var(--scheme);
  font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background .2s, color .2s;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
hr { border: none; border-top: 1px solid var(--border); margin: 0; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(127,127,127,.2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,.35); }

/* ═══════════════ LAYOUT ═══════════════ */
#app { display: grid; grid-template-columns: 256px 1fr; height: 100vh; }
#app.sb-collapsed { grid-template-columns: 68px 1fr; }
#app.auth-view, #app.wizard-view { grid-template-columns: 1fr; }

aside#sidebar {
  background: var(--bg-elev-1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.brand-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; color: #fff; }
.brand-name { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
.brand-tag { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 1px; }
.sb-collapsed .brand-name, .sb-collapsed .brand-tag { display: none; }
.sb-collapsed .brand { justify-content: center; }

.sb-section { padding: 16px 12px 6px; font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.sb-collapsed .sb-section { display: none; }

nav.sb-nav { flex: 1; overflow-y: auto; padding-bottom: 12px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 14px; margin: 1px 8px; border-radius: 8px;
  color: var(--text-2); cursor: pointer; transition: all .12s;
  font-size: 13.5px; font-weight: 500; position: relative;
}
.nav-item:hover { background: var(--bg-elev-3); color: var(--text); }
.nav-item.active { background: linear-gradient(90deg, rgba(59,130,246,.15), rgba(139,92,246,.08)); color: var(--text); }
.nav-item.active::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px; background: linear-gradient(180deg, var(--primary), var(--primary-2)); border-radius: 0 3px 3px 0; }
.nav-icon { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--critical); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 700; }
.nav-badge.info { background: rgba(59,130,246,.2); color: var(--primary); }
.sb-collapsed .nav-item { justify-content: center; padding: 10px; }
.sb-collapsed .nav-label, .sb-collapsed .nav-badge { display: none; }

.sb-footer { border-top: 1px solid var(--border); padding: 12px; flex-shrink: 0; }
.sb-toggle { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: none; border: none; border-radius: 8px; color: var(--text-2); cursor: pointer; font-size: 12px; }
.sb-toggle:hover { background: var(--bg-elev-3); color: var(--text); }

main#main { display: flex; flex-direction: column; overflow: hidden; }
header#topbar { height: 60px; flex-shrink: 0; background: var(--bg-elev-1); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.breadcrumb .crumb { color: var(--text-3); }
.breadcrumb .crumb.current { color: var(--text); font-weight: 600; }
.breadcrumb .crumb.link { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.breadcrumb .crumb.link:hover { color: var(--text); }
.breadcrumb .sep { color: var(--text-3); opacity: .5; }

/* Clickable entity references (Statement ID, Driver name) — DATATRUCK-style blue underlined links */
.elink { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.elink:hover { color: var(--primary-2); }
.elink:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }

/* Google-Sheets-style sortable column headers */
.tbl th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.tbl th.sortable:hover { color: var(--primary); }

.topbar-search { flex: 1; max-width: 420px; margin: 0 16px; position: relative; }
.topbar-search input { width: 100%; padding: 8px 14px 8px 36px; background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
.topbar-search input:focus { border-color: var(--primary); }
.topbar-search::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: .5; pointer-events: none; }

.period-selector { background: var(--bg-elev-2); border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }
.period-selector:hover { border-color: var(--border-strong); }

.topbar-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--bg-elev-2); border: 1px solid var(--border); display: grid; place-items: center; cursor: pointer; position: relative; color: var(--text); }
.icon-btn:hover { background: var(--bg-elev-3); }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--critical); border: 2px solid var(--bg-elev-1); border-radius: 50%; }

.user-menu { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; }
.user-menu:hover { background: var(--bg-elev-3); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; }
.user-info { font-size: 12px; line-height: 1.2; }
.user-info .n { font-weight: 600; }
.user-info .r { color: var(--text-3); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }

#page { flex: 1; overflow-y: auto; }
.page-wrap { padding: 24px 32px 48px; max-width: 1480px; margin: 0 auto; }
.page-head { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
.page-sub { color: var(--text-2); font-size: 13px; margin: 0; }

/* ═══════════════ PRIMITIVES ═══════════════ */
.card { background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 14px; }
.card-body { padding: 20px; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elev-2); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600; transition: all .12s; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--bg-elev-3); border-color: var(--border-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; color: #fff; }
.btn-primary:hover { opacity: .95; filter: brightness(1.1); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-elev-2); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 7px; }
.btn-danger { background: var(--critical-soft); color: var(--critical); border-color: rgba(239,68,68,.25); }
.btn-success { background: var(--success-soft); color: var(--success); border-color: rgba(16,185,129,.25); }
.btn-block { width: 100%; justify-content: center; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.badge-success  { background: var(--success-soft); color: var(--success); }
.badge-warning  { background: var(--warning-soft); color: var(--warning); }
.badge-critical { background: var(--critical-soft); color: var(--critical); }
.badge-info     { background: var(--info-soft); color: var(--info); }
.badge-primary  { background: var(--primary-soft); color: var(--primary); }
.badge-neutral  { background: var(--bg-elev-3); color: var(--text-2); border-color: var(--border); }

/* Table */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl thead th { text-align: left; padding: 11px 16px; color: var(--text-3); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--bg-elev-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.tbl tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover { background: var(--bg-elev-2); }
table.tbl tbody tr.clickable { cursor: pointer; }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl td.mono { font-variant-numeric: tabular-nums; }
.pos { color: var(--success); font-weight: 600; }
.neg { color: var(--critical); font-weight: 600; }
.muted { color: var(--text-2); }
.muted-2 { color: var(--text-3); }

/* KPI */
.kpi-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: 24px; }
.kpi { background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; position: relative; cursor: pointer; transition: all .15s; }
.kpi:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.kpi .kpi-ico { position: absolute; top: 16px; right: 16px; font-size: 18px; opacity: .25; }
.kpi .kpi-label { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 8px; }
.kpi .kpi-val { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.kpi .kpi-sub { color: var(--text-3); font-size: 11px; margin-top: 4px; }
.kpi.empty .kpi-val { color: var(--text-3); }

/* Field */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.field input, .field select, .field textarea { background: var(--bg-elev-2); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; color: var(--text); font-size: 13px; outline: none; transition: border-color .12s; font-family: inherit; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
.field .hint { font-size: 11px; color: var(--text-3); }
.field .error { font-size: 12px; color: var(--critical); }

.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }

/* Empty state */
.empty-state { padding: 60px 24px; text-align: center; }
.empty-state .es-ico { font-size: 48px; margin-bottom: 14px; opacity: .5; }
.empty-state .es-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.empty-state .es-desc { color: var(--text-2); font-size: 13.5px; max-width: 460px; margin: 0 auto 18px; }
.empty-state .es-actions { display: inline-flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* Modal */
.modal-ov { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-ov.show { display: flex; }
.modal { background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 16px; width: 580px; max-width: 94vw; max-height: 86vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal.wide { width: 820px; }
.modal-head { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text-3); font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px; overflow-y: auto; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* Toast */
#toast-root { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; box-shadow: var(--shadow-lg); font-size: 13px; min-width: 240px; max-width: 360px; animation: slide-in .2s ease-out; pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; }
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--critical); }
.toast.info { border-left: 3px solid var(--info); }
.toast .toast-ico { font-size: 16px; line-height: 1.2; flex-shrink: 0; }
.toast .toast-body { flex: 1; }
.toast .toast-title { font-weight: 700; margin-bottom: 2px; }
.toast .toast-desc { color: var(--text-2); font-size: 12px; }

@keyframes slide-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fade-in .18s ease-out; }

/* Auth */
.auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: linear-gradient(135deg, var(--bg) 0%, var(--bg-elev-2) 100%); }
.auth-card { width: 420px; max-width: 94vw; background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 18px; padding: 40px; box-shadow: var(--shadow-lg); }
.auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; justify-content: center; }
.auth-brand .brand-logo { width: 44px; height: 44px; font-size: 22px; border-radius: 10px; }
.auth-brand .auth-title { font-size: 20px; font-weight: 800; }
.auth-tabs { display: flex; gap: 4px; background: var(--bg-elev-3); padding: 4px; border-radius: 10px; margin-bottom: 24px; }
.auth-tab { flex: 1; padding: 8px; border: none; background: none; color: var(--text-2); font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 7px; }
.auth-tab.active { background: var(--bg-elev-1); color: var(--text); box-shadow: var(--shadow-sm); }

/* Wizard */
.wizard-shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.wizard-header { padding: 24px 32px; border-bottom: 1px solid var(--border); background: var(--bg-elev-1); display: flex; align-items: center; justify-content: space-between; }
.wizard-body { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 40px 20px; }
.wizard-content { width: 640px; max-width: 100%; }
.wizard-steps { display: flex; gap: 8px; margin-bottom: 32px; }
.wz-step { flex: 1; padding: 12px; background: var(--bg-elev-2); border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 12px; }
.wz-step.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 700; }
.wz-step.done { background: var(--success-soft); border-color: var(--success); color: var(--success); }
.wz-step-num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--bg-elev-3); flex-shrink: 0; font-size: 11px; }
.wz-step.active .wz-step-num { background: var(--primary); color: #fff; }
.wz-step.done .wz-step-num { background: var(--success); color: #fff; }

/* Filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 12px 16px; background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 12px; }
.filters input, .filters select { background: var(--bg-elev-2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 7px; color: var(--text); font-size: 12.5px; outline: none; font-family: inherit; }
.filters input:focus, .filters select:focus { border-color: var(--primary); }
.filters .filter-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 600; border-radius: 999px; border: 1px solid rgba(59,130,246,.2); }

/* Flags */
.flag { display: flex; gap: 14px; padding: 14px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); background: var(--bg-elev-1); }
.flag.sev-critical, .flag.sev-high { background: var(--critical-soft); border-color: rgba(239,68,68,.2); }
.flag.sev-medium { background: var(--warning-soft); border-color: rgba(245,158,11,.2); }
.flag.sev-low { background: var(--info-soft); border-color: rgba(14,165,233,.2); }
.flag.sev-ok { background: var(--success-soft); border-color: rgba(16,185,129,.2); }
.flag-sev { min-width: 90px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.sev-critical .flag-sev, .sev-high .flag-sev { color: var(--critical); }
.sev-medium .flag-sev { color: var(--warning); }
.sev-low .flag-sev { color: var(--info); }
.sev-ok .flag-sev { color: var(--success); }
.flag-body { flex: 1; }
.flag-title { font-weight: 700; font-size: 13.5px; margin-bottom: 4px; }
.flag-desc { color: var(--text-2); font-size: 12.5px; }
.flag-meta { display: flex; gap: 14px; margin-top: 8px; font-size: 11.5px; color: var(--text-3); }

/* Upload zone */
.upload-zone { border: 2px dashed var(--border-strong); border-radius: 14px; padding: 40px 24px; text-align: center; cursor: pointer; transition: all .12s; background: var(--bg-elev-1); }
.upload-zone:hover, .upload-zone.drag { border-color: var(--primary); background: var(--primary-soft); }

/* Progress */
.progress { height: 6px; background: var(--bg-elev-3); border-radius: 3px; overflow: hidden; }
.progress .bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-2)); transition: width .4s ease; }

/* Grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 960px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* Driver pill */
.driver-pill { display: inline-flex; align-items: center; gap: 8px; }
.driver-pill .ava { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 16px; background: none; border: none; color: var(--text-2); cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--primary); }

/* Alert */
.alert { padding: 12px 16px; border-radius: 10px; display: flex; gap: 12px; align-items: flex-start; font-size: 13px; }
.alert-info { background: var(--info-soft); color: var(--info); border: 1px solid rgba(14,165,233,.25); }
.alert-warning { background: var(--warning-soft); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
.alert-success { background: var(--success-soft); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
.alert-danger { background: var(--critical-soft); color: var(--critical); border: 1px solid rgba(239,68,68,.25); }

/* Dropdown menu */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu { position: absolute; top: calc(100% + 6px); right: 0; background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: 10px; min-width: 200px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 100; display: none; }
.dropdown-menu.show { display: block; }
.dropdown-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.dropdown-item:hover { background: var(--bg-elev-3); }
.dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

@media (max-width: 860px) {
  #app { grid-template-columns: 68px 1fr; }
  .brand-name, .brand-tag, .nav-label, .nav-badge, .sb-section { display: none; }
  .nav-item { justify-content: center; }
  .page-wrap { padding: 16px; }
  .topbar-search { display: none; }
  .user-info { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-ov" id="modal-ov"></div>
<div id="toast-root"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   JEFF ACCOUNTANT v3 — CORE: Storage, Auth, Theme, Policy, Audit
   ═══════════════════════════════════════════════════════════════ */

/* ───────────────── 1. BACKEND API LAYER ───────────────── */
const API_BASE = "https://jeff-backend-upxq.onrender.com";
const TOKEN_KEY = "jeff:v3:token";
const ME_KEY    = "jeff:v3:me";
const K = { THEME: "jeff:v3:theme" };  // only the theme still lives in localStorage
const S = {
  get(k, def) { try { const v = localStorage.getItem(k); return v?JSON.parse(v):def; } catch(e){ return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del(k) { localStorage.removeItem(k); }
};

async function apiRequest(path, { method="GET", body, auth=true } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth) {
    const t = localStorage.getItem(TOKEN_KEY);
    if (t) headers["Authorization"] = "Bearer " + t;
  }
  let res;
  try {
    res = await fetch(API_BASE + path, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error("Could not reach the server. Check your connection and try again.");
  }
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && data.detail) || `Request failed (${res.status})`);
  return data;
}

/* ─── Universal file export/import — generation & parsing happen on the backend (openpyxl/reportlab/pdfplumber); the frontend only shapes columns & rows ─── */
const FileIO = {
  async exportFile(kind, title, columns, rows) {
    const t = localStorage.getItem(TOKEN_KEY);
    let res;
    try {
      res = await fetch(`${API_BASE}/api/files/export/${kind}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(t ? { "Authorization": "Bearer " + t } : {}) },
        body: JSON.stringify({ title, columns, rows })
      });
    } catch (e) { toast("Export failed", "Could not reach the server", "error"); return; }
    if (!res.ok) {
      let msg = `Export failed (${res.status})`;
      try { const j = await res.json(); if (j && j.detail) msg = j.detail; } catch (e) {}
      toast("Export failed", msg, "error"); return;
    }
    const blob = await res.blob();
    const ext = kind === "xlsx" ? "xlsx" : "pdf";
    const safe = title.replace(/[^a-z0-9_\-]+/gi, "_").slice(0, 60) || "export";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${safe}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Exported", `${safe}.${ext}`, "success");
  },
  async importFile(kind, file) {
    const t = localStorage.getItem(TOKEN_KEY);
    const fd = new FormData(); fd.append("file", file);
    let res;
    try {
      res = await fetch(`${API_BASE}/api/files/import/${kind}`, { method: "POST", headers: t ? { "Authorization": "Bearer " + t } : {}, body: fd });
    } catch (e) { throw new Error("Could not reach the server."); }
    let data = null; try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.detail) || `Import failed (${res.status})`);
    return data;
  }
};

/* ─── Export-format picker: pass the same {label,key|val,type?} headers already used for CSV ─── */
let _pendingExport = null;
function openExportMenu(title, rows, headers) {
  if (!rows.length) { toast("Nothing to export", "", "error"); return; }
  _pendingExport = { title, rows, headers };
  openModal(`Export — ${H.esc(title)}`, `
    <p class="muted" style="margin:0 0 14px;font-size:13px">${rows.length} row${rows.length!==1?"s":""} · choose a format</p>
    <div style="display:flex;gap:10px">
      <button class="btn" style="flex:1" onclick="runExport('csv')">📄<br>CSV</button>
      <button class="btn" style="flex:1" onclick="runExport('xlsx')">📊<br>Excel (.xlsx)</button>
      <button class="btn" style="flex:1" onclick="runExport('pdf')">🧾<br>PDF</button>
    </div>
  `, [{ label: "Cancel", onclick: closeModal }]);
}
function runExport(kind) {
  if (!_pendingExport) return;
  const { title, rows, headers } = _pendingExport;
  closeModal();
  if (kind === "csv") {
    const csv = H.toCSV(rows, headers);
    H.download(`${title.replace(/[^a-z0-9_\-]+/gi,"_")||"export"}.csv`, csv);
    toast("Exported", `${title}.csv`, "success");
    return;
  }
  const columns = headers.map((h,i) => ({ key: `c${i}`, label: h.label, type: h.type || "text" }));
  const flatRows = rows.map(r => { const o = {}; headers.forEach((h,i) => { o[`c${i}`] = typeof h.val === "function" ? h.val(r) : r[h.key]; }); return o; });
  FileIO.exportFile(kind, title, columns, flatRows);
}

/* ─── Generic Google-Sheets-style column sorting — opt in per table with SORT.th()/SORT.apply() ─── */
const SORT = {
  state: {},
  apply(tableId, rows, getters) {
    const s = this.state[tableId];
    if (!s || !getters[s.key]) return rows;
    const get = getters[s.key];
    const arr = rows.slice();
    arr.sort((a,b) => {
      let va = get(a), vb = get(b);
      if (s.type === "number") {
        va = (va===null||va===undefined||va==="") ? -Infinity : Number(va);
        vb = (vb===null||vb===undefined||vb==="") ? -Infinity : Number(vb);
        return (va - vb) * s.dir;
      }
      va = (va===null||va===undefined) ? "" : String(va);
      vb = (vb===null||vb===undefined) ? "" : String(vb);
      return va.localeCompare(vb, undefined, { numeric: true, sensitivity: "base" }) * s.dir;
    });
    return arr;
  },
  th(tableId, key, label, type="text", extraClass="") {
    const s = this.state[tableId];
    const active = s && s.key === key;
    const arrow = active ? (s.dir === 1 ? " ▲" : " ▼") : "";
    return `<th class="sortable ${extraClass}" onclick="SORT.click('${tableId}','${key}','${type}')" title="Sort by ${H.esc(label)}">${H.esc(label)}${arrow}</th>`;
  },
  click(tableId, key, type) {
    const s = this.state[tableId];
    if (s && s.key === key) s.dir = -s.dir;
    else this.state[tableId] = { key, dir: 1, type };
    nav(currentRoute);
  }
};

/* ───────────────── 2. AUTH (talks to the real backend) ───────────────── */
let _me = S.get(ME_KEY, null);          // { user, tenant } — best-effort cache for instant sync reads
let _teamCache = {};                    // { userId: fullName } for audit-log / policy-history display
let _pendingCount = 0;                  // badge count for SUPER_ADMIN "Pending Approvals"

const AUTH = {
  setMe(user, tenant) { _me = { user, tenant }; S.set(ME_KEY, _me); },
  async login(email, password) {
    const resp = await apiRequest("/api/auth/login", { method: "POST", auth: false, body: { email, password } });
    localStorage.setItem(TOKEN_KEY, resp.access_token);
    this.setMe(resp.user, resp.tenant);
    return resp.user;
  },
  async register(fields) {
    const resp = await apiRequest("/api/auth/register", { method: "POST", auth: false, body: fields });
    if (resp.pending) return { pending: true };
    localStorage.setItem(TOKEN_KEY, resp.access_token);
    this.setMe(resp.user, resp.tenant);
    return { tenant: resp.tenant, user: resp.user, isPlatformOwner: resp.user.role === "SUPER_ADMIN" };
  },
  logout() {
    S.del(TOKEN_KEY); S.del(ME_KEY);
    window.location.href = "index.html";
  },
  session() { return _me ? { userId: _me.user.id, tenantId: _me.user.tenantId } : null; },
  user() { return _me ? _me.user : null; },
  tenant() { return _me ? _me.tenant : null; },
  requireAuth() { if (!localStorage.getItem(TOKEN_KEY)) { window.location.href = "index.html"; return false; } return true; },
  isSuperAdmin() { const u = this.user(); return u && u.role === "SUPER_ADMIN"; },
  isAdmin() { const u = this.user(); return u && (u.role === "COMPANY_ADMIN" || u.role === "SUPER_ADMIN"); },
  canEdit() { const u = this.user(); return u && (u.role !== "VIEWER"); }
};

/* ───────────────── 3. THEME ───────────────── */
const THEME = {
  get() { return S.get(K.THEME, "system"); },
  set(mode) { S.set(K.THEME, mode); this.apply(); },
  apply() {
    const mode = this.get();
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
  },
  cycle() { const curr = this.get(); const next = { light: "dark", dark: "system", system: "light" }[curr]; this.set(next); }
};
THEME.apply();

/* ───────────────── 4. POLICY (defaults + tenant overrides) ───────────────── */
const DEFAULT_POLICY = {
  OO: { admin: 10000, ifta: 4500, cargoInsurance: 35000, prepass: 375, trailer: 25000, total: 74875, rate: 86 },
  LEASE: { insurance: 45000, admin: 10000, ifta: 4500, prepass: 375, trailer: 25000, rate: 86 },
  PCODES: {
    A1: { perMile: 11, lease: 90000, label: "A1" },
    A2: { perMile:  8, lease: 80000, label: "A2 P COD" },
    A3: { perMile:  8, lease: 70000, label: "A3" },
    A4: { perMile: 11, lease: 100000, label: "A4" },
    A5: { perMile: 15, lease: 100000, label: "A5 Brand New Volvo" },
    A6: { perMile: 15, lease: 110000, label: "A6 Volvo TEAM" }
  },
  ESCROW: { target: 250000, weeklyMax: 25000 },
  SPECIAL: {},  // tenant-specific special arrangements
  CD_DEFAULT_RATE: 70,  // $0.70/mi default
  TOLERANCE_CENTS: 1
};
const POLICY = {
  get(tid) {
    const data = DATA.get(tid);
    if (data.policy && data.policy.version) return data.policy;
    // Return defaults with version 1
    return { ...JSON.parse(JSON.stringify(DEFAULT_POLICY)), version: 1, effectiveFrom: new Date().toISOString() };
  },
  save(tid, newPolicy, userId, reason) {
    const data = DATA.get(tid);
    const prev = this.get(tid);
    const nextVersion = (prev.version||1) + 1;
    newPolicy.version = nextVersion;
    newPolicy.effectiveFrom = new Date().toISOString();
    data.policyHistory = data.policyHistory || [];
    data.policyHistory.push({
      version: nextVersion, changedBy: userId, changedAt: new Date().toISOString(),
      reason: reason||"(no reason given)", prev: JSON.parse(JSON.stringify(prev)),
      next: JSON.parse(JSON.stringify(newPolicy))
    });
    data.policy = newPolicy;
    DATA.save(tid, data);
    DATA.log(tid, userId, "POLICY", `Policy v${nextVersion} saved`, { reason });
    return newPolicy;
  }
};

/* ───────────────── 5. TENANT DATA LAYER ─────────────────
   One tenant's data lives in memory (_dataCache) once loaded at startup.
   get()/save() stay SYNCHRONOUS so none of the ~40 call sites below need to
   change — save() just also fires the PUT to the backend in the background. */
const DATA = {
  empty() { return {
    mcs: [], drivers: [], trucks: [], statements: [], uploads: [],
    fleet: [], balances: [], comcheck: [], auditRuns: [], auditLog: [],
    policy: null, policyHistory: [], users: [],
    periods: []  // selected accounting periods
  }; },
  _cache: null,
  async load() {
    let payload;
    try { payload = await apiRequest("/api/data/"); } catch (e) { payload = null; }
    this._cache = (payload && Object.keys(payload).length) ? payload : this.empty();
    return this._cache;
  },
  get(tid) { return this._cache || (this._cache = this.empty()); },
  save(tid, data) {
    this._cache = data;
    apiRequest("/api/data/", { method: "PUT", body: data }).catch(e => {
      if (typeof toast === "function") toast("Save failed", e.message, "error");
    });
    return true;
  },
  log(tid, userId, module, action, meta) {
    const data = this.get(tid);
    data.auditLog = data.auditLog || [];
    data.auditLog.unshift({
      id: "log_" + Math.random().toString(36).slice(2,8),
      at: new Date().toISOString(), userId, module, action, meta: meta||{}
    });
    // keep last 500
    if (data.auditLog.length > 500) data.auditLog = data.auditLog.slice(0, 500);
    this.save(tid, data);
  },
  reset(tid) {
    this.save(tid, this.empty());
  }
};

/* ───────────────── 6. HELPERS ───────────────── */
const H = {
  uid: (p="x") => p + "_" + Math.random().toString(36).slice(2,8),
  cents: c => "$" + (c/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}),
  num: n => (n||0).toLocaleString("en-US"),
  esc: s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]),
  initials: name => (name||"?").split(/[,\s]+/).filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase(),
  color: name => {
    const colors = ["#3B82F6","#8B5CF6","#EC4899","#F59E0B","#10B981","#06B6D4","#F43F5E","#84CC16","#A855F7","#14B8A6"];
    let h = 0; for (let i=0;i<(name||"").length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
    return colors[h % colors.length];
  },
  avatar: name => `<span class="driver-pill"><span class="ava" style="background:${H.color(name)}">${H.initials(name)}</span><span>${H.esc(name)}</span></span>`,
  // Same as avatar(), but the name itself is a clickable link to the Driver Profile page.
  avatarLink: (name, driverId) => `<span class="driver-pill"><span class="ava" style="background:${H.color(name)}">${H.initials(name)}</span><span class="elink" onclick="event.stopPropagation();nav('drivers/${driverId}')">${H.esc(name)}</span></span>`,
  parseMoney: s => {
    if (!s && s !== 0) return 0;
    const n = parseFloat(String(s).replace(/[$,\s]/g,""));
    if (isNaN(n)) return 0;
    return Math.round(n * 100);
  },
  // Monday-Sunday period calc: given a date, returns Monday as start
  weekStart: (d) => {
    const x = new Date(d);
    const day = x.getDay(); // 0=Sun
    const diff = day === 0 ? -6 : 1 - day;
    x.setDate(x.getDate() + diff);
    x.setHours(0,0,0,0);
    return x;
  },
  weekEnd: (d) => {
    const s = H.weekStart(d);
    const e = new Date(s); e.setDate(e.getDate()+6); e.setHours(23,59,59,999);
    return e;
  },
  fmtDate: (d) => {
    const x = new Date(d);
    return x.toLocaleDateString("en-US", {month:"2-digit", day:"2-digit", year:"numeric"});
  },
  fmtPeriod: (startDate) => {
    const s = H.weekStart(startDate); const e = H.weekEnd(startDate);
    return `${(s.getMonth()+1).toString().padStart(2,"0")}/${s.getDate().toString().padStart(2,"0")} – ${(e.getMonth()+1).toString().padStart(2,"0")}/${e.getDate().toString().padStart(2,"0")}, ${e.getFullYear()}`;
  },
  isoDate: d => new Date(d).toISOString().slice(0,10),
  // Export to CSV
  toCSV: (rows, headers) => {
    const esc = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const head = headers.map(h=>esc(h.label)).join(",");
    const body = rows.map(r => headers.map(h => esc(typeof h.val==="function"?h.val(r):r[h.key])).join(",")).join("\n");
    return head + "\n" + body;
  },
  download: (filename, content, mime="text/csv") => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a);
    a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
};

/* ───────────────── 7. AUDIT ENGINE ───────────────── */
const AUDIT = {
  run(tid, periodStart) {
    const data = DATA.get(tid);
    const policy = POLICY.get(tid);
    const flags = [];
    const period = H.weekStart(periodStart);
    const periodEnd = H.weekEnd(periodStart);
    // Filter statements in period
    const stmts = data.statements.filter(s => {
      const sd = new Date(s.periodStart);
      return sd >= period && sd <= periodEnd;
    });
    stmts.forEach(s => flags.push(...this.auditStatement(s, data, policy)));
    flags.push(...this.auditMCReconciliation(stmts, data, policy));
    flags.push(...this.auditEscrow(stmts, data, policy));
    flags.push(...this.auditFleet(data));
    flags.push(...this.auditWeeklyCharges(stmts, data, policy));
    flags.push(...this.auditDeductionIntegrity(data));
    flags.push(...this.auditComcheck(data));
    return { flags, summary: this.summary(flags), policyVersion: policy.version,
             periodStart: period.toISOString(), periodEnd: periodEnd.toISOString(), stmtCount: stmts.length };
  },
  auditStatement(s, data, policy) {
    const flags = [];
    const d = data.drivers.find(x => x.id === s.driverId);
    if (!d) return [{severity:"CRITICAL",code:"MATCH-001",title:"Driver not matched",desc:`Statement ${s.id||"?"} references unknown driver ID`,stmtId:s.id,driverId:s.driverId}];
    const special = policy.SPECIAL[d.name];
    // Lease/OO 86% check
    if (d.type === "LEASE" || d.type === "OO") {
      (s.loads||[]).forEach(ld => {
        if (ld.rate !== policy[d.type].rate) {
          flags.push({ severity:"HIGH", code:"PCT-86", driverId:d.id, stmtId:s.id,
            title:`Load rate ≠ ${policy[d.type].rate}% (${d.type})`,
            desc:`Load ${ld.id}: ${ld.rate}% stated, expected ${policy[d.type].rate}%`,
            expected: policy[d.type].rate, actual: ld.rate, source: `${s.id} / ${ld.id}` });
        }
        const exp = Math.round(ld.gross * policy[d.type].rate / 100);
        if (Math.abs(exp - ld.pay) > policy.TOLERANCE_CENTS) {
          flags.push({ severity:"HIGH", code:"PCT-CALC", driverId:d.id, stmtId:s.id,
            title:`${policy[d.type].rate}% calculation mismatch`,
            desc:`Load ${ld.id}: ${H.cents(exp)} expected, got ${H.cents(ld.pay)}`,
            expected: exp, actual: ld.pay, diff: ld.pay - exp, source: `${s.id} / ${ld.id}` });
        }
      });
    }
    // CD payroll check
    if (d.type === "CD") {
      const totalPay = (s.loads||[]).reduce((a,l)=>a+(l.pay||0), 0);
      let expected = 0, rule = "";
      if (special && special.kind === "percent") { expected = Math.round(s.grossTotal*special.rate/100); rule = `${special.rate}% of gross`; }
      else if (special && special.kind === "team") { expected = s.totalMiles * special.rate; rule = `Team $0.${String(special.rate).padStart(2,"0")}/mi`; }
      else if (special && special.kind === "permile") { expected = s.totalMiles * special.rate; rule = `$0.${String(special.rate).padStart(2,"0")}/mi`; }
      else if (d.payRate) { expected = s.totalMiles * d.payRate; rule = `$0.${String(d.payRate).padStart(2,"0")}/mi`; }
      else { expected = s.totalMiles * policy.CD_DEFAULT_RATE; rule = `Default $0.${String(policy.CD_DEFAULT_RATE).padStart(2,"0")}/mi`; }
      if (Math.abs(expected - totalPay) > policy.TOLERANCE_CENTS) {
        flags.push({ severity:"HIGH", code:"PAY-CD", driverId:d.id, stmtId:s.id,
          title:`CD payroll mismatch (${rule})`,
          desc:`Expected ${H.cents(expected)}, got ${H.cents(totalPay)}`,
          expected, actual: totalPay, diff: totalPay - expected, source: s.id });
      }
    }
    // Lease P-code per-mile
    if (d.type === "LEASE" && d.pcode && policy.PCODES[d.pcode]) {
      const pc = policy.PCODES[d.pcode];
      const expPM = s.totalMiles * pc.perMile;
      const actPM = (s.deductions||[]).find(x => (x.label||"").toLowerCase().includes("per-mile"))?.amount || 0;
      if (Math.abs(expPM - actPM) > policy.TOLERANCE_CENTS) {
        flags.push({ severity:"MEDIUM", code:"PM-CALC", driverId:d.id, stmtId:s.id,
          title:`Per-mile charge mismatch (${d.pcode})`,
          desc:`${H.num(s.totalMiles)} mi × $0.${String(pc.perMile).padStart(2,"0")} = ${H.cents(expPM)}, got ${H.cents(actPM)}`,
          expected: expPM, actual: actPM, diff: actPM - expPM, source: s.id });
      }
    }
    // Net pay math
    const calcNet = s.earned - s.deductTotal + s.otherTotal;
    if (Math.abs(calcNet - s.netPay) > policy.TOLERANCE_CENTS) {
      flags.push({ severity:"HIGH", code:"NET-MATH", driverId:d.id, stmtId:s.id,
        title:"Net pay math error",
        desc:`${H.cents(s.earned)} − ${H.cents(s.deductTotal)} + ${H.cents(s.otherTotal)} = ${H.cents(calcNet)}, stated ${H.cents(s.netPay)}`,
        expected: calcNet, actual: s.netPay, source: s.id });
    }
    return flags;
  },
  auditMCReconciliation(stmts, data, policy) {
    const flags = [];
    const by = {};
    stmts.forEach(s => (by[s.driverId] ||= []).push(s));
    for (const [dId, list] of Object.entries(by)) {
      if (list.length < 2) continue;
      const d = data.drivers.find(x => x.id === dId);
      if (!d) continue;
      let combined = 0;
      list.forEach(s => (s.deductions||[]).forEach(x => {
        const l = (x.label||"").toLowerCase();
        if ((l.includes("admin")||l.includes("ifta")||l.includes("cargo")||l.includes("pre-pass")||l.includes("trailer")||l.includes("insurance")||l.includes("lease")) && !l.includes("per-mile") && !l.includes("fuel")) combined += x.amount;
      }));
      let expected = 0;
      if (d.type === "OO") expected = policy.OO.total;
      else if (d.type === "LEASE") expected = (policy.PCODES[d.pcode]?.lease||0) + policy.LEASE.insurance + policy.LEASE.admin + policy.LEASE.ifta + policy.LEASE.prepass + policy.LEASE.trailer;
      if (expected === 0) continue;
      const diff = combined - expected;
      if (Math.abs(diff) < policy.TOLERANCE_CENTS) {
        flags.push({ severity:"OK", code:"MC-OK", driverId:dId, title:"MC combined charges PASS",
          desc:`${d.name} across ${list.length} MCs: combined ${H.cents(combined)} = expected ${H.cents(expected)}`,
          source: list.map(s=>s.id).join(" + ") });
      } else {
        flags.push({ severity: Math.abs(diff) === 1 ? "MEDIUM" : "HIGH", code:"MC-RECON", driverId:dId,
          title:`MC reconciliation discrepancy (${diff>0?"+":""}${H.cents(diff)})`,
          desc:`${d.name}: combined ${H.cents(combined)} vs expected ${H.cents(expected)}${Math.abs(diff)===1?" — 1-CENT ALERT":""}`,
          expected, actual: combined, diff, source: list.map(s=>s.id).join(" + ") });
      }
    }
    return flags;
  },
  auditEscrow(stmts, data, policy) {
    const flags = [];
    const by = {};
    stmts.forEach(s => {
      const rows = (s.deductions||[]).filter(x => (x.label||"").toLowerCase().includes("escrow"));
      if (rows.length) (by[s.driverId] ||= []).push({ s, rows });
    });
    for (const [dId, list] of Object.entries(by)) {
      const d = data.drivers.find(x=>x.id===dId);
      let total = 0; list.forEach(x => x.rows.forEach(r => total += r.amount));
      if (total > policy.ESCROW.weeklyMax) {
        flags.push({ severity:"HIGH", code:"ESCROW-DUP", driverId:dId,
          title:"Escrow deduction exceeds weekly max",
          desc:`${d?.name||dId}: ${H.cents(total)} across ${list.length} statements, max ${H.cents(policy.ESCROW.weeklyMax)}/week`,
          source: list.map(x=>x.s.id).join(" + ") });
      }
    }
    return flags;
  },
  auditFleet(data) {
    const flags = [];
    data.fleet.forEach(wo => {
      if (wo.status === "APPLIED" && wo.appliedTo) {
        const stmt = data.statements.find(s => s.id === wo.appliedTo);
        if (!stmt) {
          flags.push({ severity:"HIGH", status:"MISSING SOURCE", code:"FLEET-MISSING", driverId:wo.driverId,
            title:"Fleet charge references missing statement",
            desc:`${wo.id} applied to ${wo.appliedTo} but statement not found`, source: wo.id });
        }
      }
      if (wo.approvalRequired && !wo.approved) {
        flags.push({ severity:"MEDIUM", status:"UNAUTHORIZED / APPROVAL REVIEW", code:"WO-APPROVAL", driverId:wo.driverId,
          title:"Work order awaiting approval",
          desc:`${wo.id} (${wo.desc||"no description"}, ${H.cents(wo.charge||wo.refund||0)}) is marked as requiring approval but has not been approved`,
          source: wo.id, stmtId: wo.appliedTo||null });
      }
      if ((wo.charge||0) > 0 && (wo.refund||0) > 0) {
        flags.push({ severity:"MEDIUM", status:"PENDING", code:"WO-BOTH", driverId:wo.driverId,
          title:"Work order has both a charge and a refund",
          desc:`${wo.id} lists both a charge (${H.cents(wo.charge)}) and a refund (${H.cents(wo.refund)}) — confirm which applies`,
          source: wo.id });
      }
    });
    return flags;
  },
  // "Other Deductions & Discounts Audit": is it sourced, who entered it, was it
  // approved when approval was required, and is the exact same charge showing
  // up more than once (same statement, or a later statement)?
  auditDeductionIntegrity(data) {
    const flags = [];
    const occurrences = new Map(); // `${driverId}|${label}|${amount}` -> [stmtId, stmtId, ...] (one push per occurrence, incl. same stmt twice)
    const track = (s, x) => {
      const key = `${s.driverId}|${(x.label||"").trim().toLowerCase()}|${x.amount}`;
      if (!occurrences.has(key)) occurrences.set(key, []);
      occurrences.get(key).push(s.id);
    };
    data.statements.forEach(s => {
      (s.deductions||[]).forEach(x => {
        track(s, x);
        if (x.approvalRequired && !x.approved) {
          flags.push({ severity:"MEDIUM", status:"UNAUTHORIZED / APPROVAL REVIEW", code:"DED-APPROVAL", driverId:s.driverId, stmtId:s.id,
            title:"Deduction awaiting approval",
            desc:`${s.id}: "${x.label}" (${H.cents(x.amount)}) is marked as requiring approval but has not been approved`,
            source: x.source || s.id, actual: x.amount });
        }
      });
      (s.otherPay||[]).forEach(x => {
        if (x.approvalRequired && !x.approved) {
          flags.push({ severity:"MEDIUM", status:"UNAUTHORIZED / APPROVAL REVIEW", code:"OP-APPROVAL", driverId:s.driverId, stmtId:s.id,
            title:"Other-pay item awaiting approval",
            desc:`${s.id}: "${x.label}" (${H.cents(x.amount)}) is marked as requiring approval but has not been approved`,
            source: x.source || s.id, actual: x.amount });
        }
      });
    });
    for (const [key, stmtIds] of occurrences.entries()) {
      if (stmtIds.length > 1) {
        const [driverId, label, amountStr] = key.split("|");
        const distinct = [...new Set(stmtIds)];
        flags.push({ severity:"HIGH", status:"DUPLICATE", code:"DED-DUP", driverId,
          title:"Possible duplicate deduction",
          desc:`"${label}" for ${H.cents(parseInt(amountStr))} appears ${stmtIds.length} times across statement(s): ${distinct.join(", ")}`,
          source: distinct.join(" + ") });
      }
    }
    return flags;
  },
  // "Weekly Charges Audit": do this driver's fixed weekly charges (insurance,
  // admin, IFTA, pre-pass, trailer, truck lease) add up to what the current
  // policy says they should, for this driver's type?
  auditWeeklyCharges(stmts, data, policy) {
    const flags = [];
    const FIXED_LABELS = /insurance|admin|ifta|pre-?pass|trailer|truck\s*lease|lease\s*fee/i;
    stmts.forEach(s => {
      const d = data.drivers.find(x=>x.id===s.driverId);
      if (!d) return;
      let expectedFixed = null;
      if (d.type === "OO") expectedFixed = policy.OO.total;
      else if (d.type === "LEASE") expectedFixed = (policy.LEASE.insurance||0)+(policy.LEASE.admin||0)+(policy.LEASE.ifta||0)+(policy.LEASE.prepass||0)+(policy.LEASE.trailer||0);
      if (expectedFixed == null) return; // Company Drivers typically don't carry these fixed weekly fees
      const fixedTotal = (s.deductions||[]).filter(x=>FIXED_LABELS.test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);
      const diff = fixedTotal - expectedFixed;
      if (Math.abs(diff) > (policy.TOLERANCE_CENTS||0)) {
        flags.push({ severity: Math.abs(diff) > expectedFixed*0.5 ? "HIGH":"MEDIUM", status:"WRONG AMOUNT", code:"WEEKLY-FIXED", driverId:s.driverId, stmtId:s.id,
          title:"Weekly fixed charges don't match policy",
          desc:`${s.id}: fixed charges total ${H.cents(fixedTotal)}, policy expects ${H.cents(expectedFixed)} for ${d.type} drivers (${diff>=0?'+':''}${H.cents(diff)})`,
          source: s.id, expected: expectedFixed, actual: fixedTotal, diff });
      }
    });
    return flags;
  },
  // "Fuel & Toll Audit": does the fuel/toll amount deducted on the statement
  // match what the Comcheck/fuel-card report actually shows for that driver
  // that week? Only runs where card data has been uploaded for that week —
  // no card data means nothing to compare, not a pass.
  auditComcheck(data) {
    const flags = [];
    if (!(data.comcheck||[]).length) return flags;
    data.statements.forEach(s => {
      const d = data.drivers.find(x=>x.id===s.driverId);
      if (!d) return;
      const periodStart = new Date(s.periodStart);
      if (isNaN(periodStart)) return;
      const periodEnd = new Date(periodStart); periodEnd.setDate(periodEnd.getDate()+6);
      const txns = data.comcheck.filter(x => x.driverId===d.id && x.date && new Date(x.date)>=periodStart && new Date(x.date)<=periodEnd);
      if (!txns.length) return;
      ["fuel","toll"].forEach(kind => {
        const cardTotal = txns.filter(x=>(x.type||"").toLowerCase().includes(kind)).reduce((a,x)=>a+(x.amount||0),0);
        const stmtTotal = (s.deductions||[]).filter(x=>new RegExp(kind,"i").test(x.label||"")).reduce((a,x)=>a+(x.amount||0),0);
        if (cardTotal === 0 && stmtTotal === 0) return;
        const diff = stmtTotal - cardTotal;
        if (Math.abs(diff) > (0)) {
          flags.push({ severity: Math.abs(diff)>5000?"HIGH":"MEDIUM", status:"MISMATCH", code:`COMCHECK-${kind.toUpperCase()}`, driverId:d.id, stmtId:s.id,
            title:`${kind==='fuel'?'Fuel':'Toll'} deduction doesn't match Comcheck`,
            desc:`${s.id}: statement shows ${H.cents(stmtTotal)} ${kind}, Comcheck shows ${H.cents(cardTotal)} for the same week (${diff>=0?'+':''}${H.cents(diff)})`,
            source: s.id, expected: cardTotal, actual: stmtTotal, diff });
        }
      });
    });
    return flags;
  },
  summary(flags) {
    const by = {CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0,OK:0};
    flags.forEach(f => by[f.severity] = (by[f.severity]||0)+1);
    const risk = Math.min(100, (by.CRITICAL||0)*25 + (by.HIGH||0)*10 + (by.MEDIUM||0)*4 + (by.LOW||0)*1);
    return { by, risk, total: flags.length - (by.OK||0) };
  }
};

/* ───────────────── 8. TOAST ───────────────── */
function toast(title, desc, type="info") {
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  const icos = { success: "✓", error: "✕", info: "ℹ" };
  t.innerHTML = `<div class="toast-ico">${icos[type]||"ℹ"}</div><div class="toast-body"><div class="toast-title">${H.esc(title)}</div>${desc?`<div class="toast-desc">${H.esc(desc)}</div>`:""}</div>`;
  document.getElementById("toast-root").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

let selectedPeriod = H.weekStart(new Date()).toISOString();

function renderShell() {
  const u = AUTH.user(); const t = AUTH.tenant();
  const isSa = AUTH.isSuperAdmin();
  // Pending count badge (kept fresh by initApp() and by approve/reject actions)
  const pendingCount = isSa ? _pendingCount : 0;
  const navHtml = NAV.filter(sec => !sec.superAdminOnly || isSa).map(sec => `
    <div class="sb-section">${sec.section}</div>
    ${sec.items.filter(it => (!it.superAdmin || isSa) && (!it.adminOnly || AUTH.isAdmin())).map(it => {
      const badge = it.route === "pending" && pendingCount > 0 ? `<span class="nav-badge">${pendingCount}</span>` : "";
      return `<div class="nav-item" data-route="${it.route}">
        <span class="nav-icon">${it.icon}</span><span class="nav-label">${it.label}</span>${badge}
      </div>`;
    }).join("")}
  `).join("");
  const themeIcons = { light: "☀️", dark: "🌙", system: "🖥️" };
  const curTheme = THEME.get();

  document.getElementById("app").className = "";
  document.getElementById("app").innerHTML = `
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">🌐</div>
        <div>
          <div class="brand-name">${H.esc(t.name)}</div>
          <div class="brand-tag">Jeff Accountant</div>
        </div>
      </div>
      <nav class="sb-nav">${navHtml}</nav>
      <div class="sb-footer">
        <button class="sb-toggle" id="sb-toggle-btn"><span>◀</span><span class="nav-label">Collapse</span></button>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div class="topbar-search"><input id="search" placeholder="Search drivers, statements, loads…"></div>
        <button class="period-selector" id="period-btn">📅 ${H.fmtPeriod(selectedPeriod)}</button>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-btn" title="Theme: ${curTheme}">${themeIcons[curTheme]}</button>
          <button class="icon-btn" id="notif-btn" title="Notifications">🔔</button>
          <div class="dropdown">
            <div class="user-menu" id="user-menu-btn">
              <div class="avatar">${H.initials(u.fullName)}</div>
              <div class="user-info"><div class="n">${H.esc(u.fullName)}</div><div class="r">${u.role.replace("_"," ")}</div></div>
            </div>
            <div class="dropdown-menu" id="user-dropdown">
              <div class="dropdown-item" onclick="nav('settings')">⚙️ Settings</div>
              <div class="dropdown-item" onclick="nav('audit_log')">📋 Audit Log</div>
              <div class="dropdown-divider"></div>
              <div class="dropdown-item" onclick="AUTH.logout()">🚪 Sign Out</div>
            </div>
          </div>
        </div>
      </header>
      <div id="page"></div>
    </main>
  `;
  document.getElementById("sb-toggle-btn").onclick = () => document.getElementById("app").classList.toggle("sb-collapsed");
  document.getElementById("theme-btn").onclick = () => { THEME.cycle(); renderShell(); nav(currentRoute); };
  document.getElementById("period-btn").onclick = openPeriodPicker;
  document.getElementById("user-menu-btn").onclick = (e) => { e.stopPropagation(); document.getElementById("user-dropdown").classList.toggle("show"); };
  document.addEventListener("click", () => document.getElementById("user-dropdown")?.classList.remove("show"));
  document.querySelectorAll(".nav-item").forEach(n => n.onclick = () => nav(n.dataset.route));
  document.getElementById("search").addEventListener("keyup", (e) => { if (e.key === "Enter") doSearch(e.target.value); });
  nav(currentRoute);
}

function nav(route) {
  // Supports two-level deep links for entities that have detail pages:
  //   #statements/ST-008760  → Statement Detail
  //   #drivers/drv_abc123    → Driver Profile
  const slash = route.indexOf("/");
  let base = slash === -1 ? route : route.slice(0, slash);
  let subId = slash === -1 ? null : route.slice(slash + 1);
  if (!ROUTES[base]) { route = "overview"; base = "overview"; subId = null; }
  const finalBase = base;
  currentRoute = route;
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.route === finalBase));
  document.getElementById("page").scrollTop = 0;
  const labels = Object.fromEntries(NAV.flatMap(s=>s.items).map(it=>[it.route, it.label]));
  const tenant = AUTH.tenant();
  const DETAIL_PAGES = {
    statements: { renderer: (id) => renderStatementDetail(id), label: (id) => { const s = DATA.get(AUTH.session().tenantId).statements.find(x=>x.id===id); return s ? s.id : id; } },
    drivers: { renderer: (id) => renderDriverProfile(id), label: (id) => { const d = DATA.get(AUTH.session().tenantId).drivers.find(x=>x.id===id); return d ? d.name : id; } },
    fleet: { renderer: (id) => renderWorkOrderDetail(id), label: (id) => { const w = DATA.get(AUTH.session().tenantId).fleet.find(x=>x.id===id); return w ? w.id : id; } }
  };
  const detail = subId && DETAIL_PAGES[finalBase] ? DETAIL_PAGES[finalBase] : null;
  if (detail) {
    document.getElementById("breadcrumb").innerHTML = `<span class="crumb">${H.esc(tenant.name)}</span><span class="sep">›</span><span class="crumb link" onclick="nav('${finalBase}')">${labels[finalBase]||finalBase}</span><span class="sep">›</span><span class="crumb current">${H.esc(detail.label(subId))}</span>`;
  } else {
    document.getElementById("breadcrumb").innerHTML = `<span class="crumb">${H.esc(tenant.name)}</span><span class="sep">›</span><span class="crumb current">${labels[finalBase]||finalBase}</span>`;
  }
  // Keep the URL hash and browser history in sync with in-app navigation
  // (pushState, not location.hash=, so this doesn't re-trigger "hashchange").
  if ((location.hash||"").slice(1) !== route) {
    try { history.pushState(null, "", "#" + route); } catch (e) { /* non-fatal */ }
  }
  const apply = (html) => {
    document.getElementById("page").innerHTML = `<div class="page-wrap fade-in">${html}</div>`;
    if (!detail && ROUTES[finalBase+"_init"]) ROUTES[finalBase+"_init"]();
  };
  const result = detail ? detail.renderer(subId) : ROUTES[finalBase]();
  // A few SUPER_ADMIN pages (pending approvals, all tenants) fetch from the
  // backend and return a Promise<string> instead of a plain string.
  if (result && typeof result.then === "function") {
    document.getElementById("page").innerHTML = `<div class="page-wrap fade-in"><div class="muted" style="padding:48px;text-align:center">Loading…</div></div>`;
    result.then(apply).catch(e => {
      document.getElementById("page").innerHTML = `<div class="page-wrap fade-in"><div class="alert alert-danger"><div>${H.esc(e.message||"Failed to load")}</div></div></div>`;
    });
  } else {
    apply(result);
  }
}

function openPeriodPicker() {
  const curr = new Date(selectedPeriod);
  openModal("Select Accounting Period", `
    <p class="muted" style="margin:0 0 14px;font-size:13px">Jeff Accountant uses strict Monday–Sunday periods. Pick any date in the week you want to audit.</p>
    <div class="field">
      <label>Any day in the target week</label>
      <input type="date" id="pp-date" value="${H.isoDate(curr)}">
    </div>
    <div class="alert alert-info"><div>📅 Selected period will become: <b id="pp-preview">${H.fmtPeriod(curr)}</b></div></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: "Apply Period", primary: true, onclick: () => {
      const d = document.getElementById("pp-date").value;
      if (d) selectedPeriod = H.weekStart(d).toISOString();
      closeModal(); renderShell();
    }}
  ]);
  setTimeout(() => {
    const dEl = document.getElementById("pp-date");
    if (dEl) dEl.addEventListener("change", (e) => {
      document.getElementById("pp-preview").textContent = H.fmtPeriod(e.target.value);
    });
  }, 50);
}

function doSearch(q) {
  if (!q) return;
  const data = DATA.get(AUTH.session().tenantId);
  const ql = q.toLowerCase();
  const found = [];
  data.drivers.forEach(d => { if (d.name.toLowerCase().includes(ql) || (d.unit||"").toLowerCase().includes(ql)) found.push({type:"Driver", id:d.id, text:d.name, sub:`Unit #${d.unit||'—'} · ${d.type}`}); });
  data.statements.forEach(s => { if ((s.id||"").toLowerCase().includes(ql)) found.push({type:"Statement", id:s.id, text:s.id, sub:s.period||'—'}); });
  if (found.length === 0) { toast("Nothing found", `No results for "${q}"`, "info"); return; }
  openModal(`Search Results (${found.length})`, found.map(f => `
    <div style="padding:10px;border-bottom:1px solid var(--border)"><span class="badge badge-neutral">${f.type}</span> <b>${H.esc(f.text)}</b> <span class="muted" style="font-size:12px">— ${H.esc(f.sub)}</span></div>
  `).join(""), [{ label: "Close", onclick: closeModal }]);
}

/* ───────────────── MODAL ───────────────── */
function openModal(title, bodyHTML, actions = []) {
  const foot = actions.length ? `<div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.primary?'btn-primary':''}" data-act="${i}">${H.esc(a.label)}</button>`).join("")}</div>` : "";
  document.getElementById("modal-ov").innerHTML = `<div class="modal"><div class="modal-head"><div class="modal-title">${H.esc(title)}</div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body">${bodyHTML}</div>${foot}</div>`;
  document.getElementById("modal-ov").classList.add("show");
  actions.forEach((a,i) => {
    const btn = document.querySelector(`.modal-foot button[data-act="${i}"]`);
    if (btn) btn.onclick = a.onclick;
  });
}

// Driver Profile — a real page at #drivers/<id>. Shows driver info plus every
// statistic that is actually derivable from this driver's real statements:
// weekly earnings, every deduction/charge (fuel, toll, violation — whatever
// label was used when it was entered) and every other-pay/refund, each tied
// to the statement/week it came from. Nothing here is invented — if a charge
// type isn't in the data, it simply won't appear in the breakdown.
function renderDriverProfile(id) {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  const d = data.drivers.find(x=>x.id===id);
  if (!d) {
    return `<div class="card"><div class="card-body empty-state"><div class="es-ico">❓</div><div class="es-title">Driver not found</div><div class="es-desc">This driver doesn't exist (they may have been deleted).</div><div class="es-actions"><button class="btn btn-primary" onclick="nav('drivers')">← Back to Drivers</button></div></div></div>`;
  }
  const mc = data.mcs.find(m=>m.id===d.mcId);
  const stmts = data.statements.filter(s=>s.driverId===id)
    .slice().sort((a,b) => new Date(b.periodStart||0) - new Date(a.periodStart||0));

  const sum = (arr, key) => arr.reduce((a,x)=>a+(x[key]||0), 0);
  const totalMiles = sum(stmts, "totalMiles");
  const totalGross = sum(stmts, "grossTotal");
  const totalEarned = sum(stmts, "earned");
  const totalDeduct = sum(stmts, "deductTotal");
  const totalOther = sum(stmts, "otherTotal");
  const totalNet = sum(stmts, "netPay");

  // Flatten every deduction and every other-pay row across all this driver's
  // statements, newest statement first, so "which week was X charged / refunded" is answerable at a glance.
  const chargeRows = [];
  const refundRows = [];
  stmts.forEach(s => {
    (s.deductions||[]).forEach(x => chargeRows.push({ period: s.period, stmtId: s.id, label: x.label, amount: x.amount }));
    (s.otherPay||[]).forEach(x => refundRows.push({ period: s.period, stmtId: s.id, label: x.label, amount: x.amount }));
  });

  // Per-label totals (e.g. all "Fuel" rows summed, all "Toll" rows summed, etc.)
  // — purely derived from whatever labels were actually typed in, no fixed category list.
  const byLabel = (rows) => {
    const m = new Map();
    rows.forEach(r => m.set(r.label, (m.get(r.label)||0) + r.amount));
    return [...m.entries()].sort((a,b) => b[1]-a[1]);
  };
  const chargeTotals = byLabel(chargeRows);
  const refundTotals = byLabel(refundRows);

  const weeklyRows = stmts.length ? stmts.map(s => `<tr class="clickable" onclick="nav('statements/${s.id}')">
    <td class="mono">${H.esc(s.period||'—')}</td>
    <td class="mono"><b class="elink">${H.esc(s.id)}</b></td>
    <td class="num mono">${H.num(s.totalMiles)}</td>
    <td class="num mono">${H.cents(s.grossTotal)}</td>
    <td class="num mono pos">${H.cents(s.earned)}</td>
    <td class="num mono neg">${s.deductTotal?('-'+H.cents(s.deductTotal)):'—'}</td>
    <td class="num mono pos">${s.otherTotal?('+'+H.cents(s.otherTotal)):'—'}</td>
    <td class="num mono"><b>${H.cents(s.netPay)}</b></td>
  </tr>`).join("") : `<tr><td colspan="8" class="muted-2" style="text-align:center;padding:16px">No statements for this driver yet</td></tr>`;

  const chargeDetailRows = chargeRows.length ? chargeRows.map(r => `<tr>
    <td class="mono">${H.esc(r.period||'—')}</td>
    <td class="mono"><span class="elink" onclick="nav('statements/${r.stmtId}')">${H.esc(r.stmtId)}</span></td>
    <td>${H.esc(r.label)}</td>
    <td class="num mono neg">-${H.cents(r.amount)}</td>
  </tr>`).join("") : `<tr><td colspan="4" class="muted-2" style="text-align:center;padding:16px">No charges/deductions recorded</td></tr>`;

  const refundDetailRows = refundRows.length ? refundRows.map(r => `<tr>
    <td class="mono">${H.esc(r.period||'—')}</td>
    <td class="mono"><span class="elink" onclick="nav('statements/${r.stmtId}')">${H.esc(r.stmtId)}</span></td>
    <td>${H.esc(r.label)}</td>
    <td class="num mono pos">+${H.cents(r.amount)}</td>
  </tr>`).join("") : `<tr><td colspan="4" class="muted-2" style="text-align:center;padding:16px">No other pay/refunds recorded</td></tr>`;

  const chargeTotalsHtml = chargeTotals.length ? `<div class="card"><div class="card-body"><h4 style="margin:0 0 10px">Charges by Type (lifetime)</h4><table class="tbl">${chargeTotals.map(([label,amt])=>`<tr><td>${H.esc(label)}</td><td class="num mono neg">-${H.cents(amt)}</td></tr>`).join("")}</table></div></div>` : "";
  const refundTotalsHtml = refundTotals.length ? `<div class="card"><div class="card-body"><h4 style="margin:0 0 10px">Other Pay by Type (lifetime)</h4><table class="tbl">${refundTotals.map(([label,amt])=>`<tr><td>${H.esc(label)}</td><td class="num mono pos">+${H.cents(amt)}</td></tr>`).join("")}</table></div></div>` : "";

  // Fuel/Toll are not a separate schema field — they're deduction rows whose label says so.
  // Surfaced explicitly here because an auditor specifically needs "fuel vs toll vs everything else" at a glance.
  const matchLabel = (rows, re) => rows.filter(r => re.test(r.label||""));
  const fuelTotal = matchLabel(chargeRows, /fuel/i).reduce((a,r)=>a+r.amount,0);
  const tollTotal = matchLabel(chargeRows, /toll/i).reduce((a,r)=>a+r.amount,0);
  const fuelTollHtml = (fuelTotal||tollTotal) ? `<div class="card"><div class="card-body"><h4 style="margin:0 0 10px">Fuel &amp; Toll (lifetime)</h4><table class="tbl">
    <tr><td>⛽ Fuel</td><td class="num mono neg">${fuelTotal?('-'+H.cents(fuelTotal)):'—'}</td></tr>
    <tr><td>🛣️ Toll</td><td class="num mono neg">${tollTotal?('-'+H.cents(tollTotal)):'—'}</td></tr>
  </table></div></div>` : "";

  const woForDriver = data.fleet.filter(w=>w.driverId===id);
  const woRows = woForDriver.length ? woForDriver.map(w => { const stmt = data.statements.find(x=>x.id===w.appliedTo); const needsApproval = w.approvalRequired && !w.approved; return `<tr class="clickable" onclick="nav('fleet/${w.id}')">
    <td class="mono"><b class="elink">${H.esc(w.id)}</b></td>
    <td>${H.esc(w.date||'—')}</td>
    <td>${H.esc(w.desc||'')}</td>
    <td class="num mono neg">${w.charge?H.cents(w.charge):'—'}</td>
    <td class="num mono pos">${w.refund?H.cents(w.refund):'—'}</td>
    <td onclick="event.stopPropagation()">${stmt?`<span class="elink" onclick="nav('statements/${stmt.id}')">${H.esc(stmt.id)}</span>`:'<span class="muted-2">—</span>'}</td>
    <td>${needsApproval?'<span class="badge badge-critical" style="margin-right:4px">NEEDS APPROVAL</span>':''}<span class="badge badge-${w.status==='APPLIED'?'success':'warning'}">${w.status||'WAITING'}</span></td>
  </tr>`; }).join("") : `<tr><td colspan="7" class="muted-2" style="text-align:center;padding:16px">No fleet charges or work orders for this driver</td></tr>`;

  return `
    <div class="page-head">
      <div>
        <p style="margin:0 0 6px"><span class="elink" onclick="nav('drivers')">← Back to Drivers</span></p>
        <h1 class="page-title">${H.esc(d.name)}</h1>
        <p class="page-sub"><span class="badge badge-${d.type==='CD'?'info':d.type==='LEASE'?'primary':'success'}">${d.type}</span> ${mc?('· '+H.esc(mc.name)):''} ${d.unit?('· Unit #'+H.esc(d.unit)):''} ${d.pcode?('· P-Code '+H.esc(d.pcode)):''}</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="editDriver('${d.id}')">Edit Driver</button>
        ${AUTH.canEdit()?`<button class="btn btn-danger" onclick="deleteDriver('${d.id}')">Delete Driver</button>`:""}
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Statements</div><div class="kpi-val">${stmts.length}</div></div>
      <div class="kpi"><div class="kpi-label">Total Miles</div><div class="kpi-val">${H.num(totalMiles)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Gross</div><div class="kpi-val">${H.cents(totalGross)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Earned</div><div class="kpi-val">${H.cents(totalEarned)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Charges</div><div class="kpi-val" style="color:var(--danger,#ef4444)">-${H.cents(totalDeduct)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Net Pay</div><div class="kpi-val">${H.cents(totalNet)}</div></div>
    </div>

    <div class="card"><div class="card-body">
      <h4 style="margin:0 0 10px">Weekly Statements (earnings by week)</h4>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Period</th><th>Stmt ID</th><th class="num">Miles</th><th class="num">Gross</th><th class="num">Earned</th><th class="num">Charges</th><th class="num">Other Pay</th><th class="num">Net</th></tr></thead><tbody>${weeklyRows}</tbody></table></div>
    </div></div>

    <div class="row" style="margin-top:16px;align-items:flex-start">
      ${chargeTotalsHtml}
      ${refundTotalsHtml}
      ${fuelTollHtml}
    </div>

    <div class="card" style="margin-top:16px"><div class="card-body">
      <h4 style="margin:0 0 10px">All Charges / Deductions (by week — fuel, tolls, violations, etc. as entered)</h4>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Week</th><th>Statement</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>${chargeDetailRows}</tbody></table></div>
    </div></div>

    <div class="card" style="margin-top:16px"><div class="card-body">
      <h4 style="margin:0 0 10px">All Other Pay / Refunds (by week)</h4>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Week</th><th>Statement</th><th>Type</th><th class="num">Amount</th></tr></thead><tbody>${refundDetailRows}</tbody></table></div>

}

function importDriversCSV() {
  openModal("Import Drivers from CSV", `
    <p class="muted" style="margin:0 0 14px;font-size:13px">Upload a CSV with headers: <code>name,type,mc_code,unit,pcode,pay_rate,pay_to</code><br>Type must be CD, LEASE, or OO. mc_code must match an existing MC code.</p>
    <div class="field"><label>CSV File</label><input type="file" id="csv-file" accept=".csv"></div>
    <div class="field"><label>Or paste CSV</label><textarea id="csv-text" rows="6" placeholder="name,type,mc_code,unit,pcode,pay_rate,pay_to
SMITH JOHN,CD,ACME,101,,70,SMITH JOHN
..."></textarea></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: "Import", primary: true, onclick: async () => {
      let text = document.getElementById("csv-text").value.trim();
      const file = document.getElementById("csv-file").files[0];
      if (file && !text) text = await file.text();
      if (!text) { toast("Nothing to import", "Paste CSV or select a file", "error"); return; }
      try {
        const tid = AUTH.session().tenantId;
        const data = DATA.get(tid);
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        const headers = lines[0].split(",").map(h=>h.trim().toLowerCase());
        const idx = (h) => headers.indexOf(h);
        let added = 0, failed = 0;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",").map(c=>c.trim().replace(/^"|"$/g,""));
          const mcCode = cols[idx("mc_code")];
          const mc = data.mcs.find(m => m.code === mcCode);
          if (!mc) { failed++; continue; }
          data.drivers.push({ id: H.uid("drv"), name: cols[idx("name")],
            type: cols[idx("type")]||"CD", mcId: mc.id,
            unit: cols[idx("unit")]||"", pcode: cols[idx("pcode")]||null,
            payRate: parseInt(cols[idx("pay_rate")])||null, payTo: cols[idx("pay_to")]||"" });
          added++;
        }
        DATA.save(tid, data);
        DATA.log(tid, AUTH.user().id, "DRIVER", `Imported ${added} drivers from CSV`, { added, failed });
        closeModal(); nav("drivers");
        toast(`Imported ${added} drivers`, failed?`${failed} rows skipped (bad MC code)`:"", "success");
      } catch (e) { toast("Import failed", e.message, "error"); }
    }}
  ]);
}

function addStmt() {
  const tid = AUTH.session().tenantId;
  const data = DATA.get(tid);
  if (data.drivers.length === 0) { toast("Add drivers first", "Add at least one driver before creating a statement.", "error"); nav("drivers"); return; }
  const driverOpts = data.drivers.map(d => `<option value="${d.id}">${H.esc(d.name)} (${d.type} · ${d.unit?('#'+d.unit):'—'})</option>`).join("");
  openModal("Add Statement", `
    <div class="field"><label>Statement ID *</label><input id="st-id" placeholder="e.g. ST-001" value="ST-${Date.now().toString().slice(-6)}"></div>
    <div class="row">
      <div class="field"><label>Driver *</label><select id="st-driver">${driverOpts}</select></div>
      <div class="field"><label>Week Starting (Mon)</label><input type="date" id="st-period" value="${H.isoDate(selectedPeriod)}"></div>
    </div>
    <div class="alert alert-info"><div>💡 After creating, you'll add loads, deductions, and other-pay rows. All totals are computed automatically. Pay in INTEGER CENTS internally (e.g. $1,234.56 → stored as 123456).</div></div>
  `, [
    { label: "Cancel", onclick: closeModal },
    { label: "Create", primary: true, onclick: () => {
      const id = document.getElementById("st-id").value.trim();
      const did = document.getElementById("st-driver").value;
      const periodDate = document.getElementById("st-period").value;
      const d = data.drivers.find(x=>x.id===did);
      if (!id || !did) { toast("Missing fields", "", "error"); return; }
      const start = H.weekStart(periodDate);
      const stmt = { id, driverId: did, mcId: d.mcId, periodStart: start.toISOString(),
        period: H.fmtPeriod(start), unit: d.unit||"", loads: [], totalMiles: 0, grossTotal: 0,
        earned: 0, deductions: [], deductTotal: 0, otherPay: [], otherTotal: 0, netPay: 0,
        status: "DRAFT" };
      data.statements.push(stmt);
      DATA.save(tid, data);
      DATA.log(tid, AUTH.user().id, "STATEMENT", "Statement created", { id, driver: d.name });
      closeModal(); showStmt(id); toast("Statement created", id, "success");
    }}
  ]);
}
